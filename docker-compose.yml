# Boss Man: server + Postgres. Runs on any Docker host.
# On TrueNAS SCALE, follow docs/06-install-truenas.md instead of the steps below.
#
# First run: follow docs/00-first-time-install.md (steps 3-5). In short, from the repo folder:
#   mkdir -p secrets && openssl rand -base64 32 > secrets/master.key
#   touch secrets/runner-app-co.token        # compose refuses to start while any secret file below is missing
#   sudo chown 1000:1000 secrets/master.key secrets/runner-app-co.token && chmod 600 secrets/master.key secrets/runner-app-co.token   # the server runs as uid 1000
#   write .env as in step 4 (POSTGRES_PASSWORD, plus the launcher settings listed below)
#   docker compose up -d
# If the server shows Restarting, run: docker compose logs server (an unreadable master key says so in one line).
# Then open http://<host>:3100 and create the owner account.
#
# Back up secrets/master.key: without it, stored secrets cannot be decrypted.
#
# Runners, the easy way (R55): turn on the launcher, and each company's runner starts by itself
# when the company is created (Settings › Server and runner › Runner shows it). In .env:
#   BOSSMAN_LAUNCHER=1
#   COMPOSE_PROFILES=launcher
#   BOSSMAN_DATA=/absolute/host/folder          # company data lives in $BOSSMAN_DATA/companies
#   BOSSMAN_DOCKER_GID=<stat -c %g /var/run/docker.sock>
# then: mkdir -p "$BOSSMAN_DATA/companies" && sudo chown 1000:1000 "$BOSSMAN_DATA/companies"
# The launcher is the only container that can reach Docker, and it accepts only "start, stop or
# restart company X's runner"; it builds the locked-down container spec itself.
#
# Runners by hand (without the launcher): create the company in the UI, then issue its runner token
# (POST /api/companies/<id>/runner, shown once) and save it:
#   printf '%s' '<token>' > secrets/runner-app-co.token
#   sudo chown 1000:1000 secrets/runner-app-co.token && chmod 600 secrets/runner-app-co.token
#   docker compose --profile runners up -d
# For another company, copy the runner-app-co block under a new name, with its own token
# file and its own three volumes (workspaces, journal, Claude sessions). A runner can also run on another machine: point BOSSMAN_URL at the
# server (wss:// behind HTTPS). Runners only dial out, so they need no published ports.

# A fixed project name keeps this stack apart from anything else on the host, e.g. TrueNAS's
# own apps (which are named ix-<app>).
name: boss-man

# Container logs are capped (BOS-2161): Docker's default keeps every line forever and slowly fills the host's disk.
# Each file of this stack repeats this block (an anchor can't cross files). Change the cap in .env with
# BOSSMAN_LOG_MAX_SIZE and BOSSMAN_LOG_MAX_FILE; it applies to a container when it is next recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${BOSSMAN_LOG_MAX_SIZE:-10m}
    max-file: "${BOSSMAN_LOG_MAX_FILE:-3}"

x-runner: &runner
  logging: *logging
  # scripts/update-runner.sh builds this tag and only promotes a build that passes the
  # canary (R52); `docker compose build` also works but skips that check.
  image: boss-man-runner:current
  build:
    context: .
    dockerfile: apps/runner/Dockerfile
  restart: unless-stopped
  profiles: ["runners"]
  depends_on:
    server:
      condition: service_started
    # Start after the installer has FINISHED its one attempt, not merely begun (BOS-972, Rod/Freddy): the runner
    # reads the ready pack once at start, so starting before the install ends would leave Claude absent until a
    # hand restart. The installer's own command always exits 0 (below), so a host with no internet still gets a
    # runner with OpenCode and Codex working, just with Claude reported absent.
    claude-pack:
      condition: service_completed_successfully
  environment: &runner-env
    BOSSMAN_URL: ws://server:3100/api/runner/connect
    BOSSMAN_RUNNER_TOKEN_FILE: /run/secrets/runner_token
    # The Claude pack volume (DR-050): mounted read-only below; the runner points Claude Code at a ready folder.
    BOSSMAN_CLAUDE_PACK: /opt/bossman-claude
    # Full checks at once (BOS-542): the compose runner never received this, only the launcher passed it on.
    BOSSMAN_CHECK_SLOTS: ${BOSSMAN_CHECK_SLOTS:-}
    # Days the runner keeps OpenCode sessions before deleting them (BOS-616): empty = 14, 0 = never.
    BOSSMAN_OPENCODE_SESSION_DAYS: ${BOSSMAN_OPENCODE_SESSION_DAYS:-}
    # Free-disk levels (BOS-2182): empty = defaults (warn under 10% or 5 GB free, hold new runs under 1024 MB).
    BOSSMAN_DISK_WARN_PERCENT: ${BOSSMAN_DISK_WARN_PERCENT:-}
    BOSSMAN_DISK_WARN_GB: ${BOSSMAN_DISK_WARN_GB:-}
    BOSSMAN_DISK_FLOOR_MB: ${BOSSMAN_DISK_FLOOR_MB:-}
  # Agents run code: keep the container unprivileged and bounded. Never mount docker.sock;
  # use a deploy target with a socket proxy instead (R14).
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: ${BOSSMAN_RUNNER_MEMORY:-4g}
  # Same value: no swap on top, so a runaway browser is killed instead of thrashing the host.
  memswap_limit: ${BOSSMAN_RUNNER_MEMORY:-4g}
  # If the host itself runs out, runners (and their browsers) are the first to go; never the server, db or proxy.
  oom_score_adj: 500
  pids_limit: ${BOSSMAN_RUNNER_PIDS:-4096}
  # CPU priority, not a cap (BOS-412): half the default weight of 1024, so on a busy host the server and database win; idle, runners use every core.
  cpu_shares: ${BOSSMAN_RUNNER_CPU_SHARES:-512}
  # Optional hard cap in CPUs for hosts shared with other workloads. 0 = none (the default).
  cpus: ${BOSSMAN_RUNNER_CPUS:-0}
  # An init as PID 1 reaps the zombies agents' tools leave behind.
  init: true

services:
  # The Claude pack (DR-050, BOS-972): the runner image holds no Anthropic code, so Claude Code and
  # its ACP adapter are installed on first start into a named volume the runner then mounts read-only.
  # It is a top-level service, NOT part of the x-runner anchor above: runner-app-co depends on it, and a
  # service can only depend on another real service (BOS-972, Dougal).
  claude-pack:
    logging: *logging
    image: boss-man-runner:current
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    profiles: ["runners"]
    # One-shot: installs the pack (npm ci + version check + canary + READY marker) and exits. Re-running
    # it on an update is cheap: a ready folder is left alone and a new lockfile installs beside the old.
    # The command exits 0 even when it can't install (no internet, npm down): readiness is proven by the READY
    # marker, not the exit code, and the runner waiting on it must still start with Claude absent (BOS-972).
    restart: "no"
    command: ["sh", "-c", "node_modules/.bin/tsx src/claude-pack-main.ts || echo '[claude-pack] install did not finish; Claude will be absent until it can'"]
    environment:
      BOSSMAN_CLAUDE_PACK: /opt/bossman-claude
      BOSSMAN_CLAUDE_PACK_SOURCE: /opt/bossman-claude-pack
    depends_on:
      - server
    # It reaches npm (honouring the host's proxy/extra CA), so it needs a network; it mounts no company data.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - claude-pack:/opt/bossman-claude
    mem_limit: ${BOSSMAN_CLAUDE_PACK_MEMORY:-2g}
    pids_limit: 512

  db:
    logging: *logging
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: bossman
      POSTGRES_USER: bossman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Memory limits (docs/00-first-time-install.md, "Memory limits"): the database is among the last things the kernel kills.
    # 0 = no cap: the db row of the owner's docker stats reading (BOS-405) was cut off, so 1g is unverified. Set BOSSMAN_DB_MEMORY to cap it.
    # CPU weight is left at Docker's default 1024 (BOS-412): runners get 512, so the database wins on a busy host. Not set here on purpose: it would change the db config for nothing.
    mem_limit: ${BOSSMAN_DB_MEMORY:-0}
    mem_reservation: ${BOSSMAN_DB_MEMORY_RESERVED:-256m}
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bossman -d bossman"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily database backup (BOS-2176, docs/29-tune-and-troubleshoot.md "Backups"): no owner step. The database's own image
  # (pg_dump always matches it, nothing extra to pull). Every 15 minutes scripts/daily-backup.sh looks at the newest
  # daily-*.sql.gz in the backup folder and makes a new one when it is over 24 hours old; it keeps the newest 14 and
  # touches no other file. The folder is BOSSMAN_BACKUP_DIR, or the install folder (the one holding this checkout).
  # The script is read fresh on every pass, so an update that changes it needs no restart of this service.
  # Stop it with `docker compose stop backup`; it is the only thing here that writes to the backup folder from inside Docker.
  backup:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    # Same cap as the other services (BOS-2161); written out here because this branch has no shared anchor yet.
    logging:
      driver: json-file
      options:
        max-size: ${BOSSMAN_LOG_MAX_SIZE:-10m}
        max-file: "${BOSSMAN_LOG_MAX_FILE:-3}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: bossman
      PGDATABASE: bossman
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BOSSMAN_BACKUP_DIR: /backups
      BOSSMAN_BACKUP_KEEP: ${BOSSMAN_BACKUP_KEEP:-14}
    entrypoint: ["sh", "-c", "while :; do bash /opt/bossman-scripts/daily-backup.sh --once; sleep 900; done"]
    volumes:
      - ${BOSSMAN_BACKUP_DIR:-..}:/backups
      - ./scripts:/opt/bossman-scripts:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BOSSMAN_BACKUP_MEMORY:-256m}
    pids_limit: 64

  server:
    logging: *logging
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # Same reason as deploy/truenas-bluegreen.yml: Docker's default 10 s cuts the shutdown drain short with SIGKILL (BOS-794).
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bossman:${POSTGRES_PASSWORD}@db:5432/bossman
      BOSSMAN_MASTER_KEY_FILE: /run/secrets/master_key
      # The runner launcher (R55); see the top of this file.
      BOSSMAN_LAUNCHER: ${BOSSMAN_LAUNCHER:-0}
      # How long a runner update waits for runs to finish before asking you (minutes).
      BOSSMAN_DRAIN_MINUTES: ${BOSSMAN_DRAIN_MINUTES:-30}
      BOSSMAN_LAUNCHER_URL: http://launcher:3105
      BOSSMAN_LAUNCHER_KEY_FILE: /run/launcher/key
      # Session cookies are Secure per request: over HTTPS through the trusted proxy below, not on plain
      # LAN http. With no trusted proxy set, cookies are always Secure, so a plain-http install (staging too) needs 1 here.
      BOSSMAN_INSECURE_COOKIES: ${BOSSMAN_INSECURE_COOKIES:-0}
      # Exact address(es) of the proxy whose X-Forwarded-* headers are believed (deploy/tailscale.yml). Empty = none.
      BOSSMAN_TRUSTED_PROXIES: ${BOSSMAN_TRUSTED_PROXIES:-}
      # The feedback portal alone, on its own port: the only port that may ever face the internet.
      BOSSMAN_PORTAL_PORT: "3101"
      # The portal's address as people reach it, for the share link, e.g. http://<host-ip>:3111.
      BOSSMAN_PORTAL_URL: ${BOSSMAN_PORTAL_URL:-}
      # The portal's reverse proxy: its own address(es) or CIDRs, e.g. 203.0.113.10, 10.0.0.0/8. Only a connection from one
      # of them may name the visitor (CF-Connecting-IP, X-Forwarded-For). Empty = the connecting address is the visitor.
      BOSSMAN_PORTAL_TRUSTED_PROXY: ${BOSSMAN_PORTAL_TRUSTED_PROXY:-}
      # Which header names the visitor: x-forwarded-for (default) or cf-connecting-ip (only when Cloudflare is the proxy).
      BOSSMAN_PORTAL_CLIENT_HEADER: ${BOSSMAN_PORTAL_CLIENT_HEADER:-}
      # JS heap cap in MiB (BOS-410). The live heap measured 89-100 MiB; 1536 leaves ~15x headroom. Raise it in .env if
      # the memory log ("memory" lines, heapUsed) ever nears it. Keep it below BOSSMAN_SERVER_MEMORY when that is set.
      NODE_OPTIONS: --max-old-space-size=${BOSSMAN_SERVER_HEAP_MB:-1536}
      # The stall profiler (BOS-602): 0 turns it off. Empty = on (the server checks only for "0").
      BOSSMAN_STALL_PROFILE: ${BOSSMAN_STALL_PROFILE:-}
    secrets:
      - master_key
    # 0 = no cap (the server uses 10-13 GiB today, see BOS-405). Set BOSSMAN_SERVER_MEMORY to cap it.
    # CPU weight is left at Docker's default 1024 (BOS-412): runners get 512, so the server wins on a busy host.
    mem_limit: ${BOSSMAN_SERVER_MEMORY:-0}
    mem_reservation: ${BOSSMAN_SERVER_MEMORY_RESERVED:-512m}
    oom_score_adj: -500
    volumes:
      # The key the launcher makes on first start; the server only reads it.
      - launcher-key:/run/launcher:ro
    networks: [default, launcher]
    ports:
      # Bound to localhost by default; set BOSSMAN_BIND=0.0.0.0 to reach it from the LAN.
      # BOSSMAN_HOST_PORT picks the host's port when 3100 is taken; the container keeps 3100.
      - "${BOSSMAN_BIND:-127.0.0.1}:${BOSSMAN_HOST_PORT:-3100}:3100"
      # The portal; bound to localhost unless BOSSMAN_PORTAL_BIND says otherwise.
      - "${BOSSMAN_PORTAL_BIND:-127.0.0.1}:${BOSSMAN_PORTAL_HOST_PORT:-3101}:3101"

  launcher:
    logging: *logging
    build:
      context: .
      dockerfile: apps/launcher/Dockerfile
    image: boss-man-launcher:current
    restart: unless-stopped
    profiles: ["launcher"]
    environment:
      BOSSMAN_DATA: ${BOSSMAN_DATA:-/srv/boss-man/data}
      # A second stack on the same host (deploy/staging.yml, docs/22-staging.md) sets these two; empty/default = today's names.
      BOSSMAN_RUNNER_NETWORK: ${BOSSMAN_RUNNER_NETWORK:-boss-man_default}
      BOSSMAN_STACK: ${BOSSMAN_STACK:-}
      BOSSMAN_RUNNER_URL: ws://server:3100/api/runner/connect
      # Empty = no cap: "Checks at once" in Settings sizes the runner's memory (BOS-993). Set a value only to cap it.
      BOSSMAN_RUNNER_MEMORY: ${BOSSMAN_RUNNER_MEMORY:-}
      BOSSMAN_RUNNER_PIDS: ${BOSSMAN_RUNNER_PIDS:-4096}
      BOSSMAN_RUNNER_CPU_SHARES: ${BOSSMAN_RUNNER_CPU_SHARES:-512}
      BOSSMAN_RUNNER_CPUS: ${BOSSMAN_RUNNER_CPUS:-}
      # Threads kept back for the server, database and proxy (BOS-586): off (default), auto = 2 on hosts with 6+ threads, or a number.
      BOSSMAN_RESERVED_THREADS: ${BOSSMAN_RESERVED_THREADS:-off}
      BOSSMAN_CHECK_SLOTS: ${BOSSMAN_CHECK_SLOTS:-}
      BOSSMAN_OPENCODE_SESSION_DAYS: ${BOSSMAN_OPENCODE_SESSION_DAYS:-}
      # The shared pnpm store (BOS-568). Launcher runners have one writable volume, so this must be a folder under
      # /home/node/workspaces, never its root (the fence would grant the whole volume and the gate store would land on
      # the root disk); any other value is refused at start-up (BOS-633).
      PNPM_STORE_DIR: ${PNPM_STORE_DIR:-}
      BOSSMAN_NETGUARD: ${BOSSMAN_NETGUARD:-auto}
      BOSSMAN_NETGUARD_ALLOW: ${BOSSMAN_NETGUARD_ALLOW:-}
      BOSSMAN_LAUNCHER_KEY_FILE: /run/launcher/key
    # Docker's socket, through the socket's own group rather than root.
    group_add: ["${BOSSMAN_DOCKER_GID:-999}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path inside and out, so the folders it binds into runners are real host paths.
      - ${BOSSMAN_DATA:-/srv/boss-man/data}/companies:${BOSSMAN_DATA:-/srv/boss-man/data}/companies
      - launcher-key:/run/launcher
    # Only the server can reach it, on a network with no way out; it publishes no ports.
    networks: [launcher]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    # BOS-1892: unhealthy in `docker compose ps` when it can't open Docker's socket or write the data folder;
    # `docker inspect --format '{{json .State.Health}}' <launcher container>` shows the fix it names.
    healthcheck:
      test: ["CMD", "node", "dist/check.js"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 10s

  # Only here so `docker compose build` makes boss-man-netguard:current, which the launcher starts
  # beside each runner (BOS-324) to block private networks. It exits at once if run.
  # BOS-1156: its own "build" profile, so `docker compose up` (even with the launcher profile on) never starts it
  # and leaves no "Exited (0)" container in the dashboard. `docker compose build netguard` (named, as the guides
  # and scripts do) still builds it, because naming a service turns its profile on.
  netguard:
    build:
      context: .
      dockerfile: apps/netguard/Dockerfile
    image: boss-man-netguard:current
    profiles: ["build"]
    restart: "no"
    command: ["--build-only"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]

  runner-app-co:
    <<: *runner
    secrets:
      - source: runner_app_co_token
        target: runner_token
    volumes:
      - app-co-workspaces:/home/node/workspaces
      - app-co-runner-data:/home/node/runner-data
      - app-co-claude:/home/node/.claude
      # The installed Claude pack, read-only (DR-050): the installer above writes it, the runner only reads.
      - claude-pack:/opt/bossman-claude:ro

secrets:
  master_key:
    file: ./secrets/master.key
  runner_app_co_token:
    file: ./secrets/runner-app-co.token

networks:
  launcher:
    internal: true

volumes:
  launcher-key:
  db-data:
  app-co-workspaces:
  app-co-runner-data:
  app-co-claude:
  # The Claude pack (DR-050): one install per stack, written by the claude-pack installer and read by runners.
  claude-pack:
