# A Boss Man check worker (DR-060): a container on ANY Docker host that takes check jobs from your Boss Man server.
# It is its OWN Compose project, never merged with Boss Man's own files. Start it on the second host:
#   docker compose -p boss-man-check-worker --env-file check-worker.env -f deploy/check-worker.yml up -d
# See docs/26-check-workers.md for the steps, per-host notes and how to update it.
#
# It dials OUT only (a wss:// address, or a Tailscale address); no port is published. It holds no GitHub, AI or deploy
# credentials: only the worker token from Settings > Server and runner > Checks > Add a check worker (shown once).
# The worker reads the token from a FILE (a token in the environment is refused, because a check could read it from
# /proc). Save the token into a file with mode 600, outside any repo, and name that file in the env file.
#
# Required in the env file:
#   BOSSMAN_WORKER_URL=wss://boss.example.com/api/check-worker/connect
#   BOSSMAN_WORKER_TOKEN_FILE=<path of the file holding the token, on this host>
#   BOSSMAN_WORKER_IMAGE=<registry>/<namespace>/boss-man-check-worker:sha-<12 characters>   or a local build, see the doc
# Optional (empty = the server's setting or the built-in default; these are examples in the doc, never defaults here):
#   BOSSMAN_CHECK_SLOTS=2            checks at once on this host (the server's per-worker setting can lower it, never raise it)
#   BOSSMAN_CHECK_WORKER_CPUS=       a hard CPU cap in CPUs (0 = none)
#   BOSSMAN_CHECK_WORKER_CPUSET=     pin to CPU threads, e.g. "8-15": test tools then size to those threads (preferred to a cap)
#   BOSSMAN_CHECK_WORKER_MEMORY=     memory limit, e.g. 14g (default 8g)
# Test workers per check and a per-check memory hint are set per worker in the Add a check worker form, not here.

services:
  check-worker:
    image: ${BOSSMAN_WORKER_IMAGE:?set BOSSMAN_WORKER_IMAGE in the env file}
    restart: unless-stopped
    environment:
      BOSSMAN_ROLE: check-worker
      BOSSMAN_URL: ${BOSSMAN_WORKER_URL:?set BOSSMAN_WORKER_URL in the env file}
      BOSSMAN_CHECK_WORKER_TOKEN_FILE: /run/secrets/check_worker_token
      BOSSMAN_CHECK_SLOTS: ${BOSSMAN_CHECK_SLOTS:-}
    secrets:
      - check_worker_token
    # Same hardening as the runner: no extra privileges, and never the Docker socket. The default Docker seccomp profile
    # leaves Landlock (the job fence) available wherever the host kernel has it; the worker logs whether it is active.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BOSSMAN_CHECK_WORKER_MEMORY:-8g}
    memswap_limit: ${BOSSMAN_CHECK_WORKER_MEMORY:-8g}
    # If the host runs out of memory, the worker goes first, not the host's other services.
    oom_score_adj: 500
    pids_limit: 4096
    cpus: ${BOSSMAN_CHECK_WORKER_CPUS:-0}
    # Empty means every thread; a cpuset is validated by Docker only when set.
    cpuset: ${BOSSMAN_CHECK_WORKER_CPUSET:-}
    init: true
    # Named Docker volumes, not host folders: Docker owns their permissions and a move or reset is one command.
    # The image's own healthcheck reads the "connected" marker in runner-data.
    volumes:
      - check-worker-repos:/home/node/workspaces
      - check-worker-data:/home/node/runner-data
    # No `ports:` on purpose.

secrets:
  check_worker_token:
    file: ${BOSSMAN_WORKER_TOKEN_FILE:?set BOSSMAN_WORKER_TOKEN_FILE in the env file}

volumes:
  check-worker-repos:
  check-worker-data:
