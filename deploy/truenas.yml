# TrueNAS SCALE override: keeps Boss Man's data in your own datasets instead of Docker
# volumes, so it's visible, snapshotted and backed up like the rest of the pool.
# Use it with the main file, from the repository root:
#   docker compose -f docker-compose.yml -f deploy/truenas.yml --profile runners up -d
# Set BOSSMAN_DATA in .env to the dataset, e.g. /mnt/<pool>/apps/boss-man (see docs/06-install-truenas.md).
# Compose merges volumes by their path inside the container, so these replace the named ones.
services:
  db:
    volumes:
      - ${BOSSMAN_DATA:?Set BOSSMAN_DATA in .env}/postgres:/var/lib/postgresql/data

  runner-app-co:
    volumes:
      - ${BOSSMAN_DATA:?Set BOSSMAN_DATA in .env}/app-co/workspaces:/home/node/workspaces
      - ${BOSSMAN_DATA:?Set BOSSMAN_DATA in .env}/app-co/runner-data:/home/node/runner-data
      - ${BOSSMAN_DATA:?Set BOSSMAN_DATA in .env}/app-co/claude:/home/node/.claude
