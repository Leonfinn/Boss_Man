# HTTPS on your tailnet for a blue/green install (BOS-278). Add it AFTER deploy/tailscale.yml in COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/<your host file>.yml:deploy/tailscale.yml:deploy/tailscale-bluegreen.yml
# where the host file is the blue/green one (e.g. deploy/truenas-bluegreen.yml). Steps: docs/20-https-tailscale.md "Blue/green installs".
#
# Path: tailnet -> Tailscale (edge) -> Caddy :3100 (proxy) -> live colour (front). Caddy believes X-Forwarded-For / -Proto only from
# the Tailscale container (BOSSMAN_EDGE_IP); the colours believe them only from Caddy (BOSSMAN_FRONT_PROXY_IP, set in the host file).
# serve.json is unchanged: it proxies to http://server:3100, and on the edge network the name "server" is Caddy's alias,
# so Tailscale reaches the owner's port only, never the feedback portal (3101).
services:
  proxy:
    networks:
      # Merged with the host file's networks (default, front); only edge is added here.
      edge:
        # Pinned so Docker never gives it the sidecar's address. Nothing else takes a dynamic address on edge in blue/green.
        ipv4_address: ${BOSSMAN_EDGE_PROXY_IP:-172.30.0.3}
        aliases: [server]
    environment:
      BOSSMAN_CADDY_TRUSTED_PROXIES: ${BOSSMAN_EDGE_IP:-172.30.0.2}/32

  tailscale:
    # The parked "server" sits behind a profile, so wait for Caddy instead.
    depends_on: !override [proxy]
