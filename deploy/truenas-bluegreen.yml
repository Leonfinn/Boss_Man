# Blue/green server (docs/09-self-deploy.md "Phase 3, part 2"; install steps: docs/06-install-truenas.md 9d). OPTIONAL.
# Not in COMPOSE_FILE = nothing here applies and the single server runs exactly as before. Turn it on by adding it last:
#   COMPOSE_FILE=docker-compose.yml:deploy/truenas.yml:deploy/truenas-bluegreen.yml
# and set BOSSMAN_DEPLOYER (the host-owned folder; the proxy's active.caddy lives in $BOSSMAN_DEPLOYER/proxy).
#
#   proxy         Caddy. Owns the host ports (UI and portal) and the network name "server", so runners keep dialling
#                 ws://server:3100 and reach whichever colour is live. Has no docker.sock and no launcher network.
#   front         a private network (internal) shared by the proxy and the two colours only. The proxy has a fixed address on it
#                 (BOSSMAN_FRONT_PROXY_IP) and reaches the live colour there as server-<colour>-front, a name that
#                 resolves on this network alone. The colours trust forwarded headers from that one address and nobody else.
#   server-blue / server-green   the same image built twice (tags boss-man-server:blue / :green). One leads; the other
#                 is a standby. The host deployer builds the idle one, hands over and flips the proxy.
#   migrate       one-shot `node dist/migrate.js`, run by the deployer before the idle colour starts.
# The single "server" service of docker-compose.yml is parked behind a profile nobody turns on.
name: boss-man

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
    args:
      BOSSMAN_COMMIT: ${BOSSMAN_COMMIT:-dev}
  restart: unless-stopped
  # The SIGTERM shutdown drains background work and queued embeddings; Docker's default 10 s cut it short with SIGKILL
  # (exit 137, BOS-794). The host deployer passes its own -t (BG_STOP_SECONDS); this covers stops and recreates by hand.
  stop_grace_period: 60s
  depends_on:
    db:
      condition: service_healthy
  secrets:
    - master_key
  # Same limits and priority as the single server in docker-compose.yml.
  # 0 = no cap (the server uses 10-13 GiB today, see BOS-405). Set BOSSMAN_SERVER_MEMORY to cap it.
  # CPU weight left at Docker's default 1024 (BOS-412); runners get 512.
  mem_limit: ${BOSSMAN_SERVER_MEMORY:-0}
  mem_reservation: ${BOSSMAN_SERVER_MEMORY_RESERVED:-512m}
  oom_score_adj: -500
  networks: [default, launcher]
  # /api/ready: the database answers. Standby and leader are both ready; the role is in the body.
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  volumes:
    - launcher-key:/run/launcher:ro
    - ${BOSSMAN_DEPLOYER:?Set BOSSMAN_DEPLOYER in .env}/inbox:/run/deployer/inbox
    - ${BOSSMAN_DEPLOYER:?Set BOSSMAN_DEPLOYER in .env}/outbox:/run/deployer/outbox:ro
  # No ports and no container_name: the proxy owns the host ports and the name "server".

x-server-env: &server-env
  DATABASE_URL: postgres://bossman:${POSTGRES_PASSWORD}@db:5432/bossman
  BOSSMAN_MASTER_KEY_FILE: /run/secrets/master_key
  BOSSMAN_LAUNCHER: ${BOSSMAN_LAUNCHER:-0}
  BOSSMAN_DRAIN_MINUTES: ${BOSSMAN_DRAIN_MINUTES:-30}
  BOSSMAN_LAUNCHER_URL: http://launcher:3105
  BOSSMAN_LAUNCHER_KEY_FILE: /run/launcher/key
  BOSSMAN_INSECURE_COOKIES: ${BOSSMAN_INSECURE_COOKIES:-0}
  BOSSMAN_PORTAL_PORT: "3101"
  BOSSMAN_PORTAL_URL: ${BOSSMAN_PORTAL_URL:-}
  # The portal's reverse proxy: its own address(es) or CIDRs. Empty = the connecting address is the visitor.
  BOSSMAN_PORTAL_TRUSTED_PROXY: ${BOSSMAN_PORTAL_TRUSTED_PROXY:-}
  # Which header names the visitor: x-forwarded-for (default) or cf-connecting-ip (only when Cloudflare is the proxy).
  BOSSMAN_PORTAL_CLIENT_HEADER: ${BOSSMAN_PORTAL_CLIENT_HEADER:-}
  # The stall profiler (BOS-602): 0 turns it off. Empty = on.
  BOSSMAN_STALL_PROFILE: ${BOSSMAN_STALL_PROFILE:-}
  BOSSMAN_DEPLOYER_DIR: /run/deployer
  # JS heap cap in MiB, as in docker-compose.yml (BOS-410).
  NODE_OPTIONS: --max-old-space-size=${BOSSMAN_SERVER_HEAP_MB:-1536}
  # The deployer runs the migrations (the migrate service) before a colour starts; a server only checks.
  BOSSMAN_MIGRATE_ON_START: "0"
  # Forwarded headers are believed from the proxy's fixed address on the private "front" network, and from nobody else.
  BOSSMAN_TRUSTED_PROXIES: ${BOSSMAN_FRONT_PROXY_IP:-172.30.0.18}

services:
  # Parked: the proxy took its name and ports. `--profile single-server` would bring it back, which is not a supported mix.
  server:
    profiles: !override ["single-server"]
    ports: !reset []

  server-blue:
    <<: *server
    image: boss-man-server:blue
    networks:
      default:
      launcher:
      front:
        aliases: [server-blue-front]
    environment:
      <<: *server-env
      BOSSMAN_COLOUR: blue
      BOSSMAN_ROLE: auto

  # Starts as a standby; the deployer promotes it with SIGUSR2.
  server-green:
    <<: *server
    image: boss-man-server:green
    networks:
      default:
      launcher:
      front:
        aliases: [server-green-front]
    environment:
      <<: *server-env
      BOSSMAN_COLOUR: green
      BOSSMAN_ROLE: standby

  migrate:
    <<: *server
    image: boss-man-server:${BOSSMAN_MIGRATE_TAG:-blue}
    profiles: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    volumes: !override []
    secrets: !override []
    networks: !override [default]
    environment: !override
      DATABASE_URL: postgres://bossman:${POSTGRES_PASSWORD}@db:5432/bossman
    command: ["node", "dist/migrate.js"]

  proxy:
    # Change version and digest together (the digest is the multi-arch index of the tag).
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    networks:
      default:
        aliases: [server]
      front:
        ipv4_address: ${BOSSMAN_FRONT_PROXY_IP:-172.30.0.18}
    ports:
      # Same variables as the single server: UI on BOSSMAN_HOST_PORT, portal on BOSSMAN_PORTAL_HOST_PORT.
      - "${BOSSMAN_BIND:-127.0.0.1}:${BOSSMAN_HOST_PORT:-3100}:3100"
      - "${BOSSMAN_PORTAL_BIND:-127.0.0.1}:${BOSSMAN_PORTAL_HOST_PORT:-3101}:3101"
    volumes:
      # Folders, not single files: a rename (which is how both are updated) gives a file a new inode, and a
      # single-file bind mount would keep showing the old one.
      - ./deploy/caddy:/etc/caddy:ro
      - ${BOSSMAN_DEPLOYER:?Set BOSSMAN_DEPLOYER in .env}/proxy:/etc/caddy-active:ro
    tmpfs:
      - /data
      - /config
    read_only: true
    cap_drop: [ALL]
    # The image's caddy binary carries this file capability; without it in the bounding set exec fails ("operation not permitted").
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Double weight: the proxy is tiny and must never wait for CPU (BOS-412).
    cpu_shares: 2048
    mem_limit: 128m
    mem_reservation: 64m
    # The proxy is the last thing the kernel may kill: when it dies, the UI is gone.
    oom_score_adj: -900
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The parked "server" no longer exists in this project, and compose refuses a service that depends on it, so both
  # services that waited on it wait on the proxy (which owns the name "server" now). The runner keeps waiting for the
  # Claude pack installer to finish, as in docker-compose.yml.
  claude-pack:
    depends_on: !override [proxy]

  runner-app-co:
    depends_on: !override
      proxy:
        condition: service_started
      claude-pack:
        condition: service_completed_successfully

networks:
  # Proxy and the two colours only: no runners, no Tailscale, no internet. Fixed proxy address, colours from the range.
  # If the default subnets clash with something on the host ("Pool overlaps"), set the three BOSSMAN_FRONT_* variables.
  front:
    internal: true
    ipam:
      config:
        - subnet: ${BOSSMAN_FRONT_SUBNET:-172.30.0.16/28}
          ip_range: ${BOSSMAN_FRONT_RANGE:-172.30.0.24/29}
