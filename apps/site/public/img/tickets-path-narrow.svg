<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1016" width="360" height="1016" role="img" aria-labelledby="tpn-title tpn-desc">
  <title id="tpn-title">A ticket's path from the backlog to done</title>
  <desc id="tpn-desc">A ticket moves from backlog to in progress, to review, to the merge queue, to done. High and critical tickets also stop for the owner's sign-off between review and the merge queue. If the check fails, the ticket goes back to in progress.</desc>
  <defs>
    <style>
      .d { font-family: "Archivo Variable", "Archivo", "IBM Plex Sans", Arial, sans-serif; font-stretch: 112%; font-weight: 750; }
      .b { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 400; }
      .bb { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 700; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#17202c"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3d4757"/></marker>
  </defs>
  <rect width="360" height="1016" fill="#ffffff"/>

  <!-- loop: check fails, back to in progress -->
  <path d="M28 545 H12 V170 H24" fill="none" stroke="#3d4757" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" marker-end="url(#al)"/>

  <!-- spine arrows -->
  <g stroke="#17202c" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M144 100 V126"/><path d="M144 210 V236"/><path d="M144 320 V356"/><path d="M144 470 V496"/><path d="M144 590 V616"/>
  </g>
  <!-- bypass for trivial, low, medium -->
  <path d="M260 280 H345 V545 H264" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ar)"/>
  <g class="b" font-size="14" fill="#3d4757" text-anchor="end">
    <text x="335" y="402">Trivial,</text><text x="335" y="420">Low,</text><text x="335" y="438">Medium</text>
  </g>

  <!-- boxes -->
  <g fill="#17202c">
    <rect x="28" y="20" width="232" height="80" rx="10"/>
    <rect x="28" y="130" width="232" height="80" rx="10"/>
    <rect x="28" y="240" width="232" height="80" rx="10"/>
    <rect x="28" y="500" width="232" height="90" rx="10"/>
    <rect x="28" y="620" width="232" height="80" rx="10"/>
  </g>
  <rect x="28" y="360" width="232" height="110" rx="10" fill="#f0b75c"/>

  <g class="d" font-size="22" fill="#eef2f6">
    <text x="48" y="58">Backlog</text>
    <text x="48" y="168">In progress</text>
    <text x="48" y="278">Review</text>
    <text x="48" y="538">Merge queue</text>
    <text x="48" y="658">Done</text>
  </g>
  <g class="b" font-size="15" fill="#c3cbd6">
    <text x="48" y="84">The ticket waits</text>
    <text x="48" y="194">An agent does the work</text>
    <text x="48" y="304">Another agent reviews it</text>
    <text x="48" y="562">Boss Man runs the</text><text x="48" y="580">check, then merges</text>
    <text x="48" y="684">On your main branch</text>
  </g>

  <!-- sign-off -->
  <text x="48" y="384" class="bb" font-size="14" fill="#17202c">High and critical only</text>
  <text x="48" y="414" class="d" font-size="22" fill="#17202c">Your sign-off</text>
  <text x="48" y="440" class="b" font-size="15" fill="#17202c">Approve and merge,</text>
  <text x="48" y="458" class="b" font-size="15" fill="#17202c">or send it back</text>

  <!-- pins -->
  <g class="bb" font-size="15" text-anchor="middle" fill="#ffffff">
    <circle cx="28" cy="20" r="13" fill="#c8282f"/><text x="28" y="25.5">1</text>
    <circle cx="28" cy="130" r="13" fill="#c8282f"/><text x="28" y="135.5">2</text>
    <circle cx="28" cy="240" r="13" fill="#c8282f"/><text x="28" y="245.5">3</text>
    <circle cx="28" cy="500" r="13" fill="#c8282f"/><text x="28" y="505.5">4</text>
    <circle cx="28" cy="620" r="13" fill="#c8282f"/><text x="28" y="625.5">5</text>
  </g>

  <text x="180" y="735" text-anchor="middle" class="bb" font-size="15" fill="#3d4757">Dotted line: check fails, back to in progress</text>

  <line x1="0" y1="760" x2="360" y2="760" stroke="#c3cbd6" stroke-width="1.5"/>
  <text x="0" y="792" class="d" font-size="18" fill="#17202c" style="font-weight:650">Who reviews, by risk</text>
  <g class="bb" font-size="16" fill="#17202c">
    <text x="0" y="822">Trivial, Low</text>
    <text x="0" y="890">Medium</text>
    <text x="0" y="958">High, Critical</text>
  </g>
  <g class="b" font-size="15" fill="#3d4757">
    <text x="0" y="842">Reviewed by the CEO.</text>
    <text x="0" y="860">No sign-off from you.</text>
    <text x="0" y="910">Reviewed by a senior developer.</text>
    <text x="0" y="928">No sign-off from you.</text>
    <text x="0" y="978">Reviewed by a senior developer,</text>
    <text x="0" y="996">then your sign-off.</text>
  </g>
</svg>
