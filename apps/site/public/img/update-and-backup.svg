<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" role="img" aria-labelledby="ub-title ub-desc">
  <title id="ub-title">What happens when you update Boss Man: back up first, update, check, and the way back if something breaks</title>
  <desc id="ub-desc">Updating the server has five steps. One: Boss Man backs up the database to a file named bossman, with the date, ending in sql.gz, in the install folder, and stops if the file is empty or damaged; the newest 14 are kept. Two: it pulls the code, only as a straight step forward from what runs now. Three: it rebuilds and restarts the server, which is down for about a minute on a single server. Four: it waits up to two minutes for the server to report healthy. Five: the runners are updated only if their code changed, and the script asks first. The Deploy latest button on the web page does the same for the server only. If the health check fails, nothing is undone by itself. If only the new code is wrong, run scripts/deploy.sh with the rollback option: the old code comes back and the database is not touched. If the update damaged the data, restore the backup in five steps: test the backup on a throwaway database until it ends with OK, stop the server, keep a copy of the current data, replace the live database with the backup, and start Boss Man again. A restore loses everything written after the backup. Runners are updated separately, about once a week: build a new runner image, check it with a test session that has no network, drain so nothing new starts while runs in progress finish, then swap each company's runner when it is idle. scripts/update-runner.sh with the rollback option undoes it. Keep a copy of the master key off the machine, because a backup cannot restore your stored secrets without it.</desc>
  <defs>
    <style>
      .d { font-family: "Archivo Variable", "Archivo", "IBM Plex Sans", Arial, sans-serif; font-stretch: 112%; font-weight: 750; }
      .b { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 400; }
      .bb { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 700; }
    </style>
    <marker id="ub-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#17202c"/></marker>
  </defs>
  <rect width="1160" height="820" fill="#ffffff"/>

  <text x="0" y="22" class="bb" font-size="16" fill="#3d4757">Every update starts with a backup. If it goes wrong, you can go back.</text>

  <!-- 1 server -->
  <circle cx="14" cy="58" r="14" fill="#c8282f"/><text x="14" y="63.5" class="bb" font-size="15" text-anchor="middle" fill="#ffffff">1</text>
  <text x="38" y="65" class="d" font-size="21" fill="#17202c">Update the server</text>
  <text x="300" y="64" class="b" font-size="15" fill="#3d4757">scripts/deploy.sh, or Deploy latest on the web page (the server only)</text>

  <rect x="0" y="86" width="200" height="124" rx="10" fill="#f0b75c"/>
  <text x="16" y="116" class="d" font-size="20" fill="#17202c">Back up</text>
  <g class="b" font-size="14" fill="#17202c"><text x="16" y="142">Saves the database to</text><text x="16" y="160">bossman-date.sql.gz.</text><text x="16" y="178">Stops if it is empty.</text></g>
  <path d="M204 148 H236" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>

  <rect x="240" y="86" width="200" height="124" rx="10" fill="#17202c"/>
  <text x="256" y="116" class="d" font-size="20" fill="#eef2f6">Pull the code</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="256" y="142">Only a straight step</text><text x="256" y="160">forward from what</text><text x="256" y="178">runs now.</text></g>
  <path d="M444 148 H476" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>

  <rect x="480" y="86" width="200" height="124" rx="10" fill="#17202c"/>
  <text x="496" y="116" class="d" font-size="20" fill="#eef2f6">Restart</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="496" y="142">Rebuilds the server and</text><text x="496" y="160">restarts it. Down for</text><text x="496" y="178">about a minute.</text></g>
  <path d="M684 148 H716" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>

  <rect x="720" y="86" width="200" height="124" rx="10" fill="#17202c"/>
  <text x="736" y="116" class="d" font-size="20" fill="#eef2f6">Health check</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="736" y="142">Waits up to 2 minutes</text><text x="736" y="160">for the server to</text><text x="736" y="178">report healthy.</text></g>
  <path d="M924 148 H956" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>

  <rect x="960" y="86" width="200" height="124" rx="10" fill="#eef2f6" stroke="#c3cbd6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="976" y="116" class="d" font-size="20" fill="#17202c">Runners</text>
  <g class="b" font-size="14" fill="#3d4757"><text x="976" y="142">Updated only if their</text><text x="976" y="160">code changed. The</text><text x="976" y="178">script asks first.</text></g>

  <!-- failure -->
  <text x="0" y="252" class="d" font-size="21" fill="#17202c">If the health check fails, nothing is undone by itself.</text>
  <text x="0" y="276" class="b" font-size="15" fill="#3d4757">Look at the logs first, then pick by what is wrong.</text>

  <rect x="0" y="296" width="440" height="288" rx="10" fill="#eef2f6" stroke="#c3cbd6" stroke-width="1.5"/>
  <text x="20" y="330" class="d" font-size="20" fill="#17202c">The new code is wrong</text>
  <text x="20" y="356" class="b" font-size="15" fill="#17202c">Put the old code back:</text>
  <rect x="20" y="372" width="400" height="46" rx="10" fill="#17202c"/>
  <text x="38" y="401" class="bb" font-size="16" fill="#eef2f6">scripts/deploy.sh --rollback</text>
  <g class="b" font-size="15" fill="#17202c"><text x="20" y="450">The old code is back and the database</text><text x="20" y="470">is not touched, so nothing written</text><text x="20" y="490">since is lost.</text></g>
  <text x="20" y="528" class="b" font-size="14" fill="#3d4757">Runners updated too? Undo that with</text>
  <text x="20" y="548" class="bb" font-size="14" fill="#17202c">scripts/update-runner.sh --rollback</text>

  <rect x="470" y="296" width="690" height="288" rx="10" fill="#ffffff" stroke="#c8282f" stroke-width="2"/>
  <text x="490" y="330" class="d" font-size="20" fill="#17202c">The update damaged the data: restore the backup</text>
  <g>
    <circle cx="504" cy="364" r="12" fill="#c8282f"/><text x="504" y="369" class="bb" font-size="14" text-anchor="middle" fill="#ffffff">1</text>
    <circle cx="504" cy="400" r="12" fill="#c8282f"/><text x="504" y="405" class="bb" font-size="14" text-anchor="middle" fill="#ffffff">2</text>
    <circle cx="504" cy="436" r="12" fill="#c8282f"/><text x="504" y="441" class="bb" font-size="14" text-anchor="middle" fill="#ffffff">3</text>
    <circle cx="504" cy="472" r="12" fill="#c8282f"/><text x="504" y="477" class="bb" font-size="14" text-anchor="middle" fill="#ffffff">4</text>
    <circle cx="504" cy="508" r="12" fill="#c8282f"/><text x="504" y="513" class="bb" font-size="14" text-anchor="middle" fill="#ffffff">5</text>
  </g>
  <g class="b" font-size="15" fill="#17202c">
    <text x="530" y="369">Test the backup you chose on a throwaway database. It must end with OK:.</text>
    <text x="530" y="405">Stop the server so nothing writes.</text>
    <text x="530" y="441">Keep a copy of the current data, in case the restore was the wrong call.</text>
    <text x="530" y="477">Replace the live database with the backup.</text>
    <text x="530" y="513">Start Boss Man again.</text>
  </g>
  <rect x="490" y="530" width="650" height="40" rx="10" fill="#f0b75c"/>
  <text x="506" y="555" class="bb" font-size="16" fill="#17202c">A restore loses everything written after the backup.</text>

  <!-- 2 runners -->
  <line x1="0" y1="610" x2="1160" y2="610" stroke="#c3cbd6" stroke-width="1.5"/>
  <circle cx="14" cy="642" r="14" fill="#c8282f"/><text x="14" y="647.5" class="bb" font-size="15" text-anchor="middle" fill="#ffffff">2</text>
  <text x="38" y="649" class="d" font-size="21" fill="#17202c">Update the runners, about once a week</text>
  <text x="520" y="648" class="b" font-size="15" fill="#3d4757">scripts/update-runner.sh, or Build and update runners on the web page</text>

  <rect x="0" y="670" width="250" height="84" rx="10" fill="#17202c"/>
  <text x="16" y="698" class="d" font-size="20" fill="#eef2f6">Build</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="16" y="722">A new runner image with</text><text x="16" y="740">the latest Claude Code.</text></g>
  <path d="M254 712 H299" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>
  <rect x="303" y="670" width="250" height="84" rx="10" fill="#17202c"/>
  <text x="319" y="698" class="d" font-size="20" fill="#eef2f6">Check</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="319" y="722">A test session, no network.</text><text x="319" y="740">If it fails, nothing changes.</text></g>
  <path d="M557 712 H602" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>
  <rect x="606" y="670" width="250" height="84" rx="10" fill="#17202c"/>
  <text x="622" y="698" class="d" font-size="20" fill="#eef2f6">Drain</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="622" y="722">Nothing new starts; runs in</text><text x="622" y="740">progress finish.</text></g>
  <path d="M860 712 H905" fill="none" stroke="#17202c" stroke-width="3" marker-end="url(#ub-ar)"/>
  <rect x="910" y="670" width="250" height="84" rx="10" fill="#17202c"/>
  <text x="926" y="698" class="d" font-size="20" fill="#eef2f6">Swap</text>
  <g class="b" font-size="14" fill="#c3cbd6"><text x="926" y="722">Each company's runner is</text><text x="926" y="740">swapped when it is idle.</text></g>

  <text x="0" y="790" class="b" font-size="15" fill="#3d4757">Keep a copy of secrets/master.key off the machine: a backup cannot restore your stored secrets without it.</text>
  <text x="0" y="810" class="b" font-size="15" fill="#3d4757">Undo a runner update with scripts/update-runner.sh --rollback.</text>
</svg>
