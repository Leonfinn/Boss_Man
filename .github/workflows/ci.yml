name: CI

# Pull requests get the full run unless they change only docs. Pushes to main are Boss Man's merges,
# which already passed scripts/check-all.sh on the owner's machine, so each job runs only for what that
# can't cover (see "changes"); both run nightly and on demand as a backstop.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to a pull request makes its older run pointless. Main keeps every run: a later
# push may skip a job the earlier one needed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.f.outputs.check }}
      images: ${{ steps.f.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Anything but a push to main, or a push whose base we can't see, runs everything.
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            printf 'check=true\nimages=true\n' >>"$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          # check: leader.test.ts needs a real Postgres, and dependency or CI changes can differ on GitHub's machines.
          echo "check=$(grep -qE '^(apps/server/src/leader\.ts|apps/server/src/db/|apps/server/drizzle/|apps/server/test/leader\.test\.ts|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/)' <<<"$files" && echo true || echo false)" >>"$GITHUB_OUTPUT"
          # images: Docker builds and container tests, which the runner can't do (it has no Docker socket).
          echo "images=$(grep -qE '(^|/)Dockerfile|^docker-compose|^deploy/|^scripts/|^skills/|^pnpm-lock\.yaml|^\.github/workflows/' <<<"$files" && echo true || echo false)" >>"$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    # A real Postgres for the leader-lock and migrate-lock tests (PGlite cannot share locks across connections).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration lint and in-memory state check (docs/10-migrations.md)
        run: |
          node --test scripts/*.test.mjs
          node scripts/lint-migrations.mjs
          node scripts/check-in-memory-state.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrations match the schema
        run: |
          pnpm --filter @boss-man/server exec drizzle-kit generate --name ci-check
          git status --porcelain apps/server/drizzle
          test -z "$(git status --porcelain apps/server/drizzle)"

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    # Builds both images so Dockerfile changes are proven before merge. Nothing is pushed:
    # the runner image contains Claude Code, which must not be redistributed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the server image
        run: docker build -f apps/server/Dockerfile --build-arg BOSSMAN_COMMIT=${{ github.sha }} -t boss-man-server:ci .
      - name: Build the runner image
        run: docker build -f apps/runner/Dockerfile --build-arg BOSSMAN_IMAGE_VERSION=ci -t boss-man-runner:ci .
      - name: Build the launcher image
        run: docker build -f apps/launcher/Dockerfile -t boss-man-launcher:current .
      - name: Build the netguard image
        run: docker build -f apps/netguard/Dockerfile -t boss-man-netguard:current .
      - name: Runner image has Claude Code, git and the runner
        run: |
          docker run --rm --entrypoint claude boss-man-runner:ci --version
          docker run --rm --entrypoint git boss-man-runner:ci --version
          docker run --rm --entrypoint sh boss-man-runner:ci -c 'test -x node_modules/.bin/tsx && test "$(id -u)" = 1000 && test -n "$CLAUDE_CODE_EXECUTABLE"'
      - name: Canary - a Claude session works inside the image, with no network (R52)
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true boss-man-runner:ci node_modules/.bin/tsx src/canary-main.ts
      - name: Server image ships the separate migrate step
        run: docker run --rm --entrypoint sh boss-man-server:ci -c 'test -f dist/migrate.js && DATABASE_URL= node dist/migrate.js 2>&1 | grep -q "DATABASE_URL is required"'
      - name: Server image serves the web UI
        run: |
          docker run --rm --entrypoint sh boss-man-server:ci -c 'test -f /app/web/index.html && ls /app/web/assets | grep -q "\.js$"'
      - name: Runner refuses to start without a token
        run: |
          if docker run --rm boss-man-runner:ci 2> err.txt; then echo "expected failure"; exit 1; fi
          grep -q "BOSSMAN_RUNNER_TOKEN" err.txt
      - name: Compose file is valid
        run: |
          mkdir -p secrets && touch secrets/master.key secrets/runner-app-co.token
          POSTGRES_PASSWORD=ci docker compose --profile runners config -q
          POSTGRES_PASSWORD=ci BOSSMAN_DATA=/srv/bm docker compose --profile launcher config -q
      - name: Penpot overlay validates as its own project, registration and prepl stay off
        run: |
          export PENPOT_BIND=127.0.0.1 PENPOT_PUBLIC_URI=http://127.0.0.1:9001 PENPOT_SECRET_KEY=x PENPOT_DB_PASSWORD=x
          docker compose -p boss-man-penpot -f deploy/penpot.yml --profile penpot config -q
          docker compose -p boss-man-penpot -f deploy/penpot.yml --profile penpot config > "$RUNNER_TEMP/merged-penpot.yml"
          grep -q "disable-registration" "$RUNNER_TEMP/merged-penpot.yml"
          if grep -q "enable-prepl-server" "$RUNNER_TEMP/merged-penpot.yml"; then echo "prepl must stay off"; exit 1; fi
          if grep -q "admin-console" "$RUNNER_TEMP/merged-penpot.yml"; then echo "admin console must stay off"; exit 1; fi
      - name: Launcher - a new company's runner starts and connects by itself (R55)
        run: |
          docker tag boss-man-server:ci boss-man-server:latest
          docker tag boss-man-runner:ci boss-man-runner:current
          scripts/ci-launcher.sh
      - name: TrueNAS override merges cleanly (docs/06-install-truenas.md)
        run: |
          POSTGRES_PASSWORD=ci BOSSMAN_DATA=/mnt/tank/apps/boss-man/data docker compose -f docker-compose.yml -f deploy/truenas.yml --profile runners config > merged.yml
          grep -q "/mnt/tank/apps/boss-man/data/postgres:/var/lib/postgresql/data\|source: /mnt/tank/apps/boss-man/data/postgres" merged.yml
          grep -q "source: /mnt/tank/apps/boss-man/data/app-co/workspaces" merged.yml
          test "$(grep -c 'target: /home/node/workspaces' merged.yml)" = 1
      - name: Tailscale override merges into a valid compose file (docs/20-https-tailscale.md)
        run: |
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f deploy/tailscale.yml config -q
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f deploy/tailscale.yml config | grep -q "BOSSMAN_TRUSTED_PROXIES: 172.30.0.2"
          POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f deploy/tailscale.yml config | grep -q "ipv4_address: 172.30.0.3"
      - name: Blue/green Tailscale overlay puts Caddy on edge as "server" (docs/20-https-tailscale.md)
        run: |
          export POSTGRES_PASSWORD=ci BOSSMAN_DATA=/srv/bm BOSSMAN_DEPLOYER=/mnt/tank/boss-man/deployer
          F="-f docker-compose.yml -f deploy/truenas-bluegreen.yml -f deploy/tailscale.yml -f deploy/tailscale-bluegreen.yml"
          docker compose $F --profile runners config -q
          docker compose $F --profile runners config --format json > merged-bgts.json
          node -e '
            const c = JSON.parse(require("fs").readFileSync("merged-bgts.json", "utf8")); const ok = (v, m) => { if (!v) { console.error(m); process.exit(1); } };
            const p = c.services.proxy;
            ok(p.networks.edge.aliases.includes("server") && p.networks.edge.ipv4_address === "172.30.0.3", "proxy must be on edge as server at the pinned address");
            ok(p.networks.front.ipv4_address === "172.30.0.18", "proxy keeps its front address");
            ok(p.environment.BOSSMAN_CADDY_TRUSTED_PROXIES === "172.30.0.2/32", "Caddy must trust only the Tailscale container");
            ok(Object.keys(c.services.tailscale.depends_on).join() === "proxy", "tailscale must wait for proxy only");
            for (const s of ["server-blue", "server-green"]) ok(!c.services[s].networks.edge, s + " must not join edge");
          '
          ! grep -q 3101 deploy/tailscale/serve.json
          ! grep -q AllowFunnel deploy/tailscale/serve.json
      - name: Self-deploy override mounts the two folders and no Docker socket
        run: |
          POSTGRES_PASSWORD=ci BOSSMAN_DATA=/srv/bm BOSSMAN_DEPLOYER=/mnt/tank/boss-man/deployer docker compose -f docker-compose.yml -f deploy/truenas.yml -f deploy/truenas-deployer.yml --profile runners config > merged-deployer.yml
          grep -q "source: /mnt/tank/boss-man/deployer/inbox" merged-deployer.yml
          grep -q "source: /mnt/tank/boss-man/deployer/outbox" merged-deployer.yml
          grep -q "BOSSMAN_DEPLOYER_DIR: /run/deployer" merged-deployer.yml
      - name: Blue/green override renders, the proxy owns the name "server", and nothing but the launcher has the Docker socket
        run: |
          export POSTGRES_PASSWORD=ci BOSSMAN_DATA=/srv/bm BOSSMAN_DEPLOYER=/mnt/tank/boss-man/deployer
          docker compose -f docker-compose.yml -f deploy/truenas.yml -f deploy/truenas-bluegreen.yml --profile runners --profile migrate --profile launcher config > merged-bg.yml
          for s in proxy server-blue server-green migrate; do grep -q "^  $s:" merged-bg.yml; done
          ! grep -q "^  server:" merged-bg.yml
          grep -A4 "aliases:" merged-bg.yml | grep -q "^ *- server$"
          grep -q "source: /mnt/tank/boss-man/deployer/proxy" merged-bg.yml
          test "$(grep -c 'source: /var/run/docker.sock' merged-bg.yml)" = 1
          # The private "front" network: internal, the proxy has the fixed address, both colours trust exactly that address, runners are not on it.
          docker compose -f docker-compose.yml -f deploy/truenas.yml -f deploy/truenas-bluegreen.yml --profile runners config --format json > merged-bg.json
          node -e '
            const c = JSON.parse(require("fs").readFileSync("merged-bg.json", "utf8"));
            const ok = (v, m) => { if (!v) { console.error("FAIL: " + m); process.exit(1); } };
            ok(c.networks.front && c.networks.front.internal === true, "front must be an internal network");
            const ip = c.services.proxy.networks.front && c.services.proxy.networks.front.ipv4_address;
            ok(ip === "172.30.0.18", "proxy needs the fixed front address, got " + ip);
            for (const s of ["server-blue", "server-green"]) {
              ok(c.services[s].environment.BOSSMAN_TRUSTED_PROXIES === ip, s + " must trust only the proxy front address");
              ok(c.services[s].networks.front.aliases.includes(s + "-front"), s + " needs its front alias");
            }
            for (const [n, s] of Object.entries(c.services)) {
              if (n.startsWith("runner")) ok(!(s.networks || {}).front, n + " must not be on front");
            }
            ok(!c.services.db.networks || !c.services.db.networks.front, "db must not be on front");
          '
          # Without the file the single server is unchanged.
          docker compose -f docker-compose.yml -f deploy/truenas.yml config | grep -q "^  server:"
      - name: The Caddyfile and a generated include validate with the pinned Caddy
        run: |
          mkdir -p active
          # Both include forms scripts/host-deployer.sh writes: the front-network one and the older one.
          printf '(active) {\n\treverse_proxy server-blue-front:{args[0]} {\n\t\theader_up X-Forwarded-For {client_ip}\n\t\thealth_uri {args[1]}\n\t}\n}\n' > active/active.caddy
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -v "$PWD/active:/etc/caddy-active:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e BOSSMAN_CADDY_TRUSTED_PROXIES="172.30.0.3/32" -v "$PWD/deploy/caddy:/etc/caddy:ro" -v "$PWD/active:/etc/caddy-active:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          printf '(active) {\n\treverse_proxy server-blue:{args[0]} {\n\t\thealth_uri {args[1]}\n\t}\n}\n' > active/active.caddy
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -v "$PWD/active:/etc/caddy-active:ro" caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Spoofed forwarded headers through the real Caddyfile (scripts/caddy-edge.test.sh)
        run: |
          id=$(docker create caddy:2.11.7)
          docker cp "$id:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$id"
          CADDY="$RUNNER_TEMP/caddy" scripts/caddy-edge.test.sh
      - name: Shell script tests (deploy.sh, the host deployer, backup and Penpot)
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          scripts/check-shell.sh
          scripts/test-shell.sh
