name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        run: |
          pnpm --filter @boss-man/server exec drizzle-kit generate --name ci-check
          git status --porcelain apps/server/drizzle
          test -z "$(git status --porcelain apps/server/drizzle)"
