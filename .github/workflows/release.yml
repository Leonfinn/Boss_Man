name: Release

# The owner's "beta" button (BOS-973, plan: BOS-935, DR-050): Actions > Release > Run workflow, branch main, type a
# version such as 0.1.0-beta.1. It builds nothing. It takes the images the Publish workflow already built and signed
# for the newest commit on main (or, when the optional "commit" box holds the full 40-character sha of an older green
# main commit whose images are published, for that commit: main moves every few minutes while the merge line is busy),
# gives them the version tag and the moving "beta" tag in every registry, and signs and
# publishes release.json, the list of exact image digests per architecture that the updater (BOS-941) trusts.
# Settings are the same as publish.yml (docs/25-published-images.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 0.1.0-beta.1 (no leading v)"
        required: true
        type: string
      commit:
        description: "Optional: full 40-character sha of a commit on main whose images are published. Blank = main's newest commit"
        required: false
        default: ""
        type: string

permissions: {}

# Its own group (BOS-2302): it used to share publish-images, where GitHub cancels a waiting run when a third arrives,
# so a main publish could silently drop the owner's Release press. It needs no publish to be running: the check step
# below fails loudly, saying what to wait for, when the commit's images are not there yet.
concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  release:
    # The signature names this workflow on main, and the updater trusts only that.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # BOS-2097: no green run yet to time. It builds nothing, only re-tags, signs and uploads (publish.yml's similar
    # "publish" job: longest 1.3 min), so 15 minutes; a hung step would otherwise hold the release-images group for 6 hours.
    timeout-minutes: 15
    # The Docker Hub secrets live in this environment, which only main may use (see docs/25-published-images.md).
    environment: publish
    permissions:
      contents: write # the GitHub release that carries release.json
      packages: write
      id-token: write
    env:
      IMAGE_PREFIXES: ${{ vars.IMAGE_PREFIXES }}
      PUBLISH_IMAGES: ${{ vars.PUBLISH_IMAGES }}
      DOCKERHUB_PUBLISH: ${{ vars.DOCKERHUB_PUBLISH }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit input is checked against the history of main
      - uses: docker/setup-buildx-action@v3
      - name: Install cosign v2.4.1 (retries the download, checks a pinned SHA-256; BOS-1726)
        run: scripts/install-cosign.sh v2.4.1
      - name: Read and check the publishing settings (fails loudly when Docker Hub is on and a secret is missing)
        id: s
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # Refuses a commit that is not 40 hex or not on main, before anything is tagged.
          SHA="$(scripts/publish-images.sh resolve-commit "$COMMIT_INPUT" "$GITHUB_SHA")"
          echo "Releasing commit $SHA"
          prefixes="$(scripts/publish-images.sh prefixes)"
          scripts/publish-images.sh images > /dev/null
          {
            echo "sha=$SHA"
            echo "ghcr=$(if echo "$prefixes" | grep -q '^ghcr.io/'; then echo true; else echo false; fi)"
            echo "hub=$(if echo "$prefixes" | grep -q '^docker.io/'; then echo true; else echo false; fi)"
            echo "tag=$(scripts/publish-images.sh tag "$SHA")"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: ${{ steps.s.outputs.ghcr == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: ${{ steps.s.outputs.hub == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: The version is new, and the commit being released has its images
        env:
          TAG: ${{ steps.s.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Version '$VERSION' is not like 0.1.0 or 0.1.0-beta.1."; exit 1; }
          if gh release view "v$VERSION" > /dev/null 2>&1; then echo "Version $VERSION is already released. Pick a new version."; exit 1; fi
          for p in $(scripts/publish-images.sh prefixes); do
            for name in $(scripts/publish-images.sh images); do
              if docker buildx imagetools inspect "$p/$name:$VERSION" > /dev/null 2>&1; then echo "$p/$name:$VERSION already exists. Pick a new version."; exit 1; fi
            done
          done
          first="$(scripts/publish-images.sh prefixes | head -n 1)"
          missing=""
          for name in $(scripts/publish-images.sh images); do
            docker buildx imagetools inspect "$first/$name:$TAG" > /dev/null 2>&1 || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "No image for commit ${{ steps.s.outputs.sha }} ($TAG) for:$missing."
            echo "Either the 'Publish images' run for that commit has not finished (wait, then run this again), or an image was added to PUBLISH_IMAGES after that commit was published: re-run 'Publish images' for the commit (Actions > Publish images > the run > Re-run all jobs), or type the sha of an older green main commit in the commit box."
            exit 1
          fi
      - name: Check every image in every registry (identical digest, signature, SBOM, provenance)
        env:
          TAG: ${{ steps.s.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          first="$(scripts/publish-images.sh prefixes | head -n 1)"
          : > "$RUNNER_TEMP/verified-digests"
          for name in $(scripts/publish-images.sh images); do
            digest="$(docker buildx imagetools inspect "$first/$name:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
            scripts/publish-images.sh copy "$name" "$TAG" "$digest"
            scripts/publish-images.sh verify "$name" "$digest"
            # Keep the digest that was verified; the tagging step reuses it, it never looks it up again.
            echo "$name $digest" >> "$RUNNER_TEMP/verified-digests"
          done
      - name: Add the version and beta tags (the same digests, nothing is rebuilt)
        env:
          TAG: ${{ steps.s.outputs.tag }}
        run: |
          set -euo pipefail
          for p in $(scripts/publish-images.sh prefixes); do
            while read -r name digest; do
              docker buildx imagetools create -t "$p/$name:$VERSION" -t "$p/$name:beta" "$p/$name@$digest"
            done < "$RUNNER_TEMP/verified-digests"
          done
      - name: Write release.json from what the registries now hold, and sign it
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.s.outputs.sha }}
        run: |
          set -euo pipefail
          # Reading the version tag back proves it landed, with the same digest, in every registry.
          scripts/publish-images.sh release-json "$VERSION" "$SHA" "$VERSION" > release.json
          jq . release.json
          cosign sign-blob --yes --bundle release.json.sigstore.json release.json
          cosign verify-blob --bundle release.json.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            release.json
      - name: Make the image install files from the signed release.json, and sign them too (BOS-974)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The image install needs all four images. Until the runner image is published (BOS-972) a release has no images.env;
          # say so and carry on, so the existing beta release is not held up.
          # BOS-1227: the updater is in the default stack, so the install files need it too.
          if ! jq -e '[.. | strings | select(test("boss-man-runner"))] | length > 0' release.json >/dev/null || ! jq -e '[.. | strings | select(test("boss-man-updater"))] | length > 0' release.json >/dev/null; then
            echo "::warning::release.json lists no boss-man-runner or boss-man-updater image, so this release has no images.env or docker-compose.images.yml."
            exit 0
          fi
          # images.env is only release.json's digests in the form docker-compose.images.yml reads.
          scripts/render-image-env.sh release.json > images.env
          # The compose file is the one checked out at this commit, signed as it is.
          for f in images.env docker-compose.images.yml; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
              "$f"
          done
      - name: Publish release.json as a pre-release (beta)
        env:
          SHA: ${{ steps.s.outputs.sha }}
        run: |
          set -euo pipefail
          assets=(release.json release.json.sigstore.json)
          if [ -f images.env ]; then assets+=(images.env images.env.sigstore.json docker-compose.images.yml docker-compose.images.yml.sigstore.json); fi
          gh release create "v$VERSION" "${assets[@]}" --prerelease --target "$SHA" \
            --title "Boss Man $VERSION" --notes "Beta release. The images are listed, by digest and architecture, in release.json, which is signed (release.json.sigstore.json)."
