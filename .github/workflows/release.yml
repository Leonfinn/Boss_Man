name: Release

# The owner's "beta" button (BOS-973, plan: BOS-935, DR-050): Actions > Release > Run workflow, branch main, type a
# version such as 0.1.0-beta.1. It builds nothing. It takes the images the Publish workflow already built and signed
# for the newest commit on main (or, when the optional "commit" box holds the full 40-character sha of an older green
# main commit whose images are published, for that commit: main moves every few minutes while the merge line is busy),
# gives them the version tag and the moving "beta" tag in every registry, and signs and
# publishes release.json, the list of exact image digests per architecture that the updater (BOS-941) trusts.
# Settings are the same as publish.yml (docs/25-published-images.md).
#
# The weekly beta (BOS-2662): GitHub starts this workflow by itself once a week (the cron line below), with no one pressing
# anything. A scheduled run picks the newest commit of main that passed CI and has every image published, signed and
# built for amd64 and arm64 (scripts/release-pick.sh), takes the next beta number after the newest release, and writes the
# release notes from the CHANGELOG.md lines added since the last beta (scripts/release-notes.sh). With no such commit, or
# nothing new since the last beta, it ends green with a one-line reason and releases nothing. It never retries; a failed
# run is picked up by Boss Man's main-CI watcher, which tells the CEO. A pressed (manual) run works exactly as before.
on:
  schedule:
    # THE WEEKLY TIME: minute hour day-of-month month day-of-week, in UTC. "0 10 * * 2" is Tuesday 10:00 UTC. Change this one
    # line to move it (or delete the two lines of this schedule to switch the weekly release off).
    - cron: "0 10 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 0.1.0-beta.1 (no leading v)"
        required: true
        type: string
      commit:
        description: "Optional: full 40-character sha of a commit on main whose images are published. Blank = main's newest commit"
        required: false
        default: ""
        type: string

permissions: {}

# Its own group (BOS-2302): it used to share publish-images, where GitHub cancels a waiting run when a third arrives,
# so a main publish could silently drop the owner's Release press. It needs no publish to be running: the check step
# below fails loudly, saying what to wait for, when the commit's images are not there yet.
concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  release:
    # The signature names this workflow on main, and the updater trusts only that.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # BOS-2097: no green run yet to time. It builds nothing, only re-tags, signs and uploads (publish.yml's similar
    # "publish" job: longest 1.3 min), so 15 minutes; a hung step would otherwise hold the release-images group for 6 hours.
    timeout-minutes: 15
    # The Docker Hub secrets live in this environment, which only main may use (see docs/25-published-images.md).
    environment: publish
    permissions:
      contents: write # the GitHub release that carries release.json
      packages: write
      id-token: write
    env:
      IMAGE_PREFIXES: ${{ vars.IMAGE_PREFIXES }}
      PUBLISH_IMAGES: ${{ vars.PUBLISH_IMAGES }}
      DOCKERHUB_PUBLISH: ${{ vars.DOCKERHUB_PUBLISH }}
      # BOS-2903: the release notes' pointer line needs the site's address. The website publish reads it from the `site`
      # environment, which this job (environment: publish) cannot see, so it comes from the repository variable instead
      # (Settings > Secrets and variables > Actions > Variables). This job-level env takes precedence over any SITE_URL
      # on the `publish` environment, so set the repository variable. Empty on a fork with no website:
      # scripts/release-notes.sh then leaves the pointer line out.
      SITE_URL: ${{ vars.SITE_URL }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
      # VERSION, RELEASE_SHA, RELEASE_TAG, RELEASE_PREV_SHA and RELEASE_SKIP are set for the later steps through
      # $GITHUB_ENV: VERSION by the step below for a pressed run, all of them by "Pick the commit" for a scheduled one.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit input is checked against the history of main
      - uses: docker/setup-buildx-action@v3
      - name: Install cosign v2.4.1 (retries the download, checks a pinned SHA-256; BOS-1726)
        run: scripts/install-cosign.sh v2.4.1
      - name: Read and check the publishing settings (fails loudly when Docker Hub is on and a secret is missing)
        id: s
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prefixes="$(scripts/publish-images.sh prefixes)"
          scripts/publish-images.sh images > /dev/null
          {
            echo "ghcr=$(if echo "$prefixes" | grep -q '^ghcr.io/'; then echo true; else echo false; fi)"
            echo "hub=$(if echo "$prefixes" | grep -q '^docker.io/'; then echo true; else echo false; fi)"
          } >> "$GITHUB_OUTPUT"
          # A scheduled run has no typed version: "Pick the commit and the version" below decides it.
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            # The typed version goes into $GITHUB_ENV: a newline in it would add env lines (RELEASE_SHA, BASH_ENV), so
            # refuse anything but a plain one-line version first.
            if [ "$(printf '%s' "$VERSION_INPUT" | grep -cE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$')" != 1 ] || [ "$(printf '%s' "$VERSION_INPUT" | wc -l)" != 0 ]; then
              echo "::error::version must look like 0.1.0-beta.4 (one line, no spaces)"
              exit 1
            fi
            echo "VERSION=$VERSION_INPUT" >> "$GITHUB_ENV"
          fi
      - uses: docker/login-action@v3
        if: ${{ steps.s.outputs.ghcr == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: ${{ steps.s.outputs.hub == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pick the commit and the version (scheduled runs only; a skip ends the run green with its reason)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$(scripts/release-pick.sh pick)"
          echo "$out"
          # BOS-2666: green commits but no recorded docs check is a refusal, not a quiet skip: the run fails, so Boss Man's
          # main-CI watcher tells the CEO. Nothing has been tagged or released at this point.
          refuse="$(printf '%s\n' "$out" | sed -n 's/^refuse=//p' | head -n 1)"
          if [ -n "$refuse" ]; then
            echo "::error title=Release refused::$(printf '%s' "$refuse" | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          skip="$(printf '%s\n' "$out" | sed -n 's/^skip=//p')"
          if [ -z "$skip" ]; then
            sha="$(printf '%s\n' "$out" | sed -n 's/^sha=//p')"
            # GitHub refuses the release (HTTP 403) on a commit whose workflow files differ from main's: skip, say why.
            if ! scripts/publish-images.sh workflows-match "$sha" 2> "$RUNNER_TEMP/err"; then
              skip="Commit $sha can't be released by this workflow: $(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-300)"
            fi
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Weekly release skipped::$skip"
            echo "RELEASE_SKIP=$skip" | tr -d '\r' | head -n 1 >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "RELEASE_SHA=$sha"
            echo "RELEASE_TAG=$(printf '%s\n' "$out" | sed -n 's/^tag=//p')"
            echo "VERSION=$(printf '%s\n' "$out" | sed -n 's/^version=//p')"
            echo "RELEASE_PREV_SHA=$(printf '%s\n' "$out" | sed -n 's/^prev_sha=//p')"
          } >> "$GITHUB_ENV"
      - name: Pick the commit to release (a half-finished release of this version resumes on its own commit)
        id: c
        if: ${{ github.event_name != 'schedule' }}
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # BOS-2602: run #6 of 0.1.0-beta.2 was pressed with the commit box blank after runs #3/#4 had tagged commit
          # c94ebeb3's images. Blank meant main's newest commit, so the next step refused, in the log only (agents can't
          # read it). After the registry login, so private images can be read: a blank box now takes the commit the
          # version's images were built from (their revision label). A new version has no such images: main's newest.
          # That commit still has to pass workflows-match below, or the run stops with a readable reason.
          if ! held="$(scripts/publish-images.sh version-commit "$VERSION" 2> "$RUNNER_TEMP/err")"; then
            echo "::error title=Can't tell which commit $VERSION is on::$(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-400)"; exit 1
          fi
          input="$COMMIT_INPUT"
          if [ -n "$held" ] && [ -z "$input" ]; then
            input="$held"
            echo "::notice title=Resuming $VERSION::Its images were already tagged from commit $held, so this run finishes that release (the commit box was blank)."
          fi
          # Refuses a commit that is not 40 hex or not on main, before anything is tagged.
          if ! SHA="$(scripts/publish-images.sh resolve-commit "$input" "$GITHUB_SHA" 2> "$RUNNER_TEMP/err")"; then
            echo "::error title=Commit refused::$(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-400)"; exit 1
          fi
          # Before anything is tagged: GitHub refuses the release (HTTP 403) on a commit whose workflow files differ from
          # main's, which left 0.1.0-beta.2 half-made on c94ebeb3 (runs #3 and #4).
          if ! scripts/publish-images.sh workflows-match "$SHA" 2> "$RUNNER_TEMP/err"; then
            echo "::error title=Commit can't be released by this workflow::$(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-600)"; exit 1
          fi
          echo "Releasing commit $SHA"
          {
            echo "sha=$SHA"
            echo "held=$held"
            echo "tag=$(scripts/publish-images.sh tag "$SHA")"
          } >> "$GITHUB_OUTPUT"
          { echo "RELEASE_SHA=$SHA"; echo "RELEASE_TAG=$(scripts/publish-images.sh tag "$SHA")"; } >> "$GITHUB_ENV"
      - name: Docs gate (BOS-2666; stage wording, What's new, a recorded docs check; before any tag or release, both ways of starting)
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          # A pressed run has not looked up the previous release yet (a scheduled one did, in "Pick the commit").
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            RELEASE_PREV_SHA="$(scripts/release-docs-gate.sh prev)"; export RELEASE_PREV_SHA
            echo "RELEASE_PREV_SHA=$RELEASE_PREV_SHA" >> "$GITHUB_ENV"
          fi
          if ! out="$(scripts/release-docs-gate.sh check "$VERSION" "$SHA" 2>&1)"; then
            echo "$out"
            # The last line is the one-line reason; the lines above it are file:line. Annotations are readable without the log.
            echo "::error title=Release blocked by the docs gate::$(printf '%s\n' "$out" | tail -n 1 | cut -c1-400)"
            exit 1
          fi
          echo "$out"
      - name: Image label gate (BOS-2841; the What's new entries of this release say "In image <version>" in the commit being released)
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          # Labelling happens on main before the run (scripts/changelog-label.sh label), not here: a push made with this
          # workflow's token starts no CI, so no "Publish images" run would build the labelled commit and the release would
          # have no image to tag. Here the label is only proven to have reached the commit that is tagged; before any tag.
          if ! out="$(scripts/changelog-label.sh check "$VERSION" "${RELEASE_PREV_SHA:-}" "$SHA" 2>&1)"; then
            echo "$out"
            echo "::error title=Release blocked: What's new is not labelled for this image::$(printf '%s\n' "$out" | tail -n 1 | cut -c1-400)"
            exit 1
          fi
          echo "What's new entries of $VERSION carry their image label at ${SHA:0:12}."
      - name: The version is new, and the commit being released has its images
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          TAG: ${{ env.RELEASE_TAG }}
          SHA: ${{ env.RELEASE_SHA }}
          HELD: ${{ steps.c.outputs.held }}
        run: |
          set -euo pipefail
          # Every refusal is an annotation too: annotations are readable without the job log (BOS-2602).
          refuse() { echo "$1"; echo "::error title=Release refused::$(echo "$1" | tr '\n' ' ' | cut -c1-400)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || refuse "Version '$VERSION' is not like 0.1.0 or 0.1.0-beta.1."
          if gh release view "v$VERSION" > /dev/null 2>&1; then refuse "Version $VERSION is already released. Pick a new version."; fi
          first="$(scripts/publish-images.sh prefixes | head -n 1)"
          missing=""
          for name in $(scripts/publish-images.sh images); do
            docker buildx imagetools inspect "$first/$name:$TAG" > /dev/null 2>&1 || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            refuse "No image for commit $SHA ($TAG) for:$missing. Either the 'Publish images' run for that commit has not finished (wait, then run this again), or an image was added to PUBLISH_IMAGES after that commit was published: re-run 'Publish images' for the commit (Actions > Publish images > the run > Re-run all jobs), or type the sha of an older green main commit in the commit box."
          fi
          # A version tag that is already on an image is fine only when it is this commit's own image (same digest): a
          # half-finished run (tags added, GitHub release not made, checked above) resumes. Tagging again is a no-op.
          # A version tag on a different digest is another release's image: refuse, never move it.
          for p in $(scripts/publish-images.sh prefixes); do
            for name in $(scripts/publish-images.sh images); do
              existing="$(docker buildx imagetools inspect "$p/$name:$VERSION" --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest || true)"
              [ -n "$existing" ] || continue
              want="$(docker buildx imagetools inspect "$first/$name:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
              if [ "$existing" != "$want" ]; then refuse "$p/$name:$VERSION already exists and is not the image of commit $SHA (it is on commit ${HELD:-unknown}). Leave the commit box blank to finish $VERSION on that commit, or pick a new version."; fi
              echo "::notice::$p/$name:$VERSION is already on this commit's image: resuming a half-finished release."
            done
          done
      - name: Check every image in every registry (identical digest, signature, SBOM, provenance)
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          first="$(scripts/publish-images.sh prefixes | head -n 1)"
          : > "$RUNNER_TEMP/verified-digests"
          for name in $(scripts/publish-images.sh images); do
            digest="$(docker buildx imagetools inspect "$first/$name:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
            scripts/publish-images.sh copy "$name" "$TAG" "$digest"
            scripts/publish-images.sh verify "$name" "$digest"
            # Keep the digest that was verified; the tagging step reuses it, it never looks it up again.
            echo "$name $digest" >> "$RUNNER_TEMP/verified-digests"
          done
      - name: Add the version and beta tags (the same digests, nothing is rebuilt)
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # The moving tag is the stage word (beta, rc, ...) from the one helper that knows it; a stable release moves "latest".
          stage="$(scripts/release-docs-gate.sh stage-of "$VERSION")"
          moving="$stage"; [ "$stage" != stable ] || moving=latest
          for p in $(scripts/publish-images.sh prefixes); do
            while read -r name digest; do
              docker buildx imagetools create -t "$p/$name:$VERSION" -t "$p/$name:$moving" "$p/$name@$digest"
            done < "$RUNNER_TEMP/verified-digests"
          done
      - name: Write release.json from what the registries now hold, and sign it
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          # Reading the version tag back proves it landed, with the same digest, in every registry.
          scripts/publish-images.sh release-json "$VERSION" "$SHA" "$VERSION" > release.json
          jq . release.json
          cosign sign-blob --yes --bundle release.json.sigstore.json release.json
          cosign verify-blob --bundle release.json.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            release.json
      - name: Make the image install files from the signed release.json, and sign them too (BOS-974)
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A scheduled run may release a commit older than main's head, which is what is checked out: take the compose
          # file as it was at the released commit, so it matches that release's images. (A pressed run is unchanged.)
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then git checkout "$RELEASE_SHA" -- docker-compose.images.yml docker-compose.ntfy.images.yml; fi
          # The image install needs all four images. Until the runner image is published (BOS-972) a release has no images.env;
          # say so and carry on, so the existing beta release is not held up.
          # BOS-1227: the updater is in the default stack, so the install files need it too.
          if ! jq -e '[.. | strings | select(test("boss-man-runner"))] | length > 0' release.json >/dev/null || ! jq -e '[.. | strings | select(test("boss-man-updater"))] | length > 0' release.json >/dev/null; then
            echo "::warning::release.json lists no boss-man-runner or boss-man-updater image, so this release has no images.env or docker-compose.images.yml."
            exit 0
          fi
          # images.env is only release.json's digests in the form docker-compose.images.yml reads.
          scripts/render-image-env.sh release.json > images.env
          # The compose file is the one checked out at this commit, signed as it is.
          # BOS-2912: docker-compose.ntfy.images.yml (phone notifications for an image install) has no image digests of ours, so it
          # is signed as it is, like the compose file.
          for f in images.env docker-compose.images.yml docker-compose.ntfy.images.yml; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
              "$f"
          done
      - name: Publish release.json as a pre-release (beta)
        if: ${{ env.RELEASE_SKIP == '' }}
        env:
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          # The body is the CHANGELOG lines added since the last release (scripts/release-notes.sh), the same lines the
          # website's "What's new" page shows, for a pressed run as well since BOS-2666 (the docs gate above refused an
          # empty list).
          RELEASE_VERSION="$VERSION" scripts/release-notes.sh "${RELEASE_PREV_SHA:-}" "$SHA" > "$RUNNER_TEMP/notes.md"
          flags=(--prerelease)
          [ "$(scripts/release-docs-gate.sh stage-of "$VERSION")" != stable ] || flags=()
          assets=(release.json release.json.sigstore.json)
          if [ -f images.env ]; then assets+=(images.env images.env.sigstore.json docker-compose.images.yml docker-compose.images.yml.sigstore.json docker-compose.ntfy.images.yml docker-compose.ntfy.images.yml.sigstore.json); fi
          # BOS-2601: this step failed in 1 s on release #3 and the job log is not readable by agents. Name any missing
          # file, and put GitHub's own error text in an annotation (annotations are readable without the log).
          for f in "${assets[@]}"; do
            [ -s "$f" ] || { echo "::error title=Release file missing::$f is missing or empty, nothing was published. Files here: $(ls | tr '\n' ' ')"; exit 1; }
          done
          if ! out="$(gh release create "v$VERSION" "${assets[@]}" "${flags[@]}" --target "$SHA" \
            --title "Boss Man $VERSION" --notes-file "$RUNNER_TEMP/notes.md" 2>&1)"; then
            echo "$out"
            echo "::error title=gh release create failed::$(echo "$out" | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi
          echo "$out"
