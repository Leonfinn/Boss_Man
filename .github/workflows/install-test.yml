name: Install test

# BOS-974: installs Boss Man the way the guide says (docs/35-install-from-images.md) on a real x86 runner and a real arm64 runner:
# pull by digest, setup twice, start, answer /api/health, start a runner from the published image.
# It starts by itself when the Release workflow finishes successfully (nobody has to remember), and tests that release.
# A red run means the release can't be installed: it is reported like any failed workflow. It can also be started by hand:
# Actions > Install test > Run workflow, type the version (like 0.1.0-beta.1).
# It only reads a published release; it changes nothing in the repository or the registries.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to install, like 0.1.0-beta.1 (no leading v)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # After a Release run, only a successful one has a release to test.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Find the version (the newest release, when started by the Release workflow)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          [ -n "$tag" ] || { echo "No release found to test."; exit 1; }
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Check the release can be installed at all
        # A release made before the runner image is published has no images.env (release.yml leaves it out on purpose).
        # There is nothing to install then, so skip with a notice instead of a red run.
        run: |
          set -euo pipefail
          assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qx 'images.env' <<<"$assets"; then
            echo "INSTALLABLE=yes" >> "$GITHUB_ENV"
          else
            echo "::notice::Release v$VERSION has no images.env (no runner image was published), so there is nothing to install. Skipping."
            echo "INSTALLABLE=no" >> "$GITHUB_ENV"
          fi
      - if: ${{ env.INSTALLABLE == 'yes' }}
        uses: actions/checkout@v7
      - if: ${{ env.INSTALLABLE == 'yes' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - if: ${{ env.INSTALLABLE == 'yes' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the release files and check their signature
        if: ${{ env.INSTALLABLE == 'yes' }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Version '$VERSION' is not like 0.1.0-beta.1."; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern 'release.json*' --pattern 'images.env*' --pattern 'docker-compose.images.yml*'
          cd "$RUNNER_TEMP/release"
          for f in release.json images.env docker-compose.images.yml; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
              "$f"
          done
      - name: Install from the images (real Docker, ${{ matrix.arch }})
        if: ${{ env.INSTALLABLE == 'yes' }}
        run: |
          set -euo pipefail
          # The test reads the signed compose file from the release, not the one in this checkout, so it tests what people download.
          cp "$RUNNER_TEMP/release/docker-compose.images.yml" docker-compose.images.yml
          INSTALL_RELEASE_JSON="$RUNNER_TEMP/release/release.json" scripts/install-images.test.sh
