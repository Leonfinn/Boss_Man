name: Install test

# BOS-974: installs Boss Man the way the guide says (docs/35-install-from-images.md) on a real x86 runner and a real arm64 runner:
# pull by digest, setup twice, start, answer /api/health, start a runner from the published image.
# It starts by itself when the Release workflow finishes successfully (nobody has to remember), and tests that release.
# A red run means the release can't be installed: it is reported like any failed workflow. The one skip (green, with a notice)
# is a release whose release.json lists no runner image, which by design has no install files. It can also be started by hand:
# Actions > Install test > Run workflow, type the version (like 0.1.0-beta.1).
# It only reads a published release; it changes nothing in the repository or the registries.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to install, like 0.1.0-beta.1 (no leading v)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # After a Release run, only a successful one has a release to test.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Find the version (the release the finished Release run made, when started by the Release workflow)
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          # The Release run has no tag in its payload, so take the newest published (not draft) release made since that run
          # started (by publishedAt: GitHub dates createdAt by the tagged commit, which is older than the run),
          # not just the newest one: a draft, or an older release that sorts first, is never picked.
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,publishedAt,isDraft \
            | jq -r --arg s "$RUN_STARTED" '[.[] | select(.isDraft | not) | select(.publishedAt >= $s)] | sort_by(.publishedAt) | last | .tagName // empty')"
          [ -n "$tag" ] || { echo "The Release run succeeded but no release made since $RUN_STARTED was found to test."; exit 1; }
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Check the release can be installed at all
        # Only a release made before the runner image is published has no images.env (release.yml leaves it out on purpose,
        # and only then: when release.json lists no boss-man-runner). Skip with a notice for exactly that case.
        # A release whose release.json lists the runner image but has no images.env is the fault this test exists to catch: fail.
        run: |
          set -euo pipefail
          assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qx 'images.env' <<<"$assets"; then
            echo "INSTALLABLE=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/probe"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/probe" --pattern release.json
          if jq -e '[.. | strings | select(test("boss-man-runner"))] | length > 0' "$RUNNER_TEMP/probe/release.json" >/dev/null; then
            echo "::error::Release v$VERSION lists the runner image but has no images.env: the Release workflow failed to publish the install files."
            exit 1
          fi
          echo "::notice::Release v$VERSION lists no boss-man-runner image (before the runner image was published), so it has no images.env and nothing to install. Skipping."
          echo "INSTALLABLE=no" >> "$GITHUB_ENV"
      - if: ${{ env.INSTALLABLE == 'yes' }}
        uses: actions/checkout@v7
      - if: ${{ env.INSTALLABLE == 'yes' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - if: ${{ env.INSTALLABLE == 'yes' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the release files and check their signature
        if: ${{ env.INSTALLABLE == 'yes' }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Version '$VERSION' is not like 0.1.0-beta.1."; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern 'release.json*' --pattern 'images.env*' --pattern 'docker-compose.images.yml*'
          cd "$RUNNER_TEMP/release"
          for f in release.json images.env docker-compose.images.yml; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
              "$f"
          done
      - name: Install from the images (real Docker, ${{ matrix.arch }})
        if: ${{ env.INSTALLABLE == 'yes' }}
        run: |
          set -euo pipefail
          # The test reads the signed compose file from the release, not the one in this checkout, so it tests what people download.
          cp "$RUNNER_TEMP/release/docker-compose.images.yml" docker-compose.images.yml
          # The script writes the seconds from its first command to /api/health answering into this file (BOS-1488).
          INSTALL_SECONDS_FILE="$RUNNER_TEMP/install-seconds" INSTALL_RELEASE_JSON="$RUNNER_TEMP/release/release.json" scripts/install-images.test.sh
      - name: Write this machine's result (runs even when the install failed, and a failure never reads as a pass)
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          result=fail
          seconds=0
          if [ "$JOB_STATUS" = success ] && [ "${INSTALLABLE:-}" = no ]; then
            result=skipped
          elif [ "$JOB_STATUS" = success ] && [ "${INSTALLABLE:-}" = yes ] && [ -s "$RUNNER_TEMP/install-seconds" ]; then
            result=pass
            seconds="$(cat "$RUNNER_TEMP/install-seconds")"
          fi
          jq -n --arg arch "$ARCH" --arg result "$result" --arg version "${VERSION:-}" --argjson seconds "$seconds" \
            '{arch: $arch, result: $result, version: $version, minutes: (($seconds / 6 | round) / 10)}' > "$RUNNER_TEMP/out/result-$ARCH.json"
          cat "$RUNNER_TEMP/out/result-$ARCH.json"
      - name: Keep the result for the record job
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: install-result-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/result-${{ matrix.arch }}.json
          retention-days: 7
          if-no-files-found: error

  # BOS-1488: joins the two machines' results into install-result.json (date, version, pass or fail, minutes), attaches it to
  # the release, and marks the release in its title and notes when the test failed. The install guide on the website reads
  # that file at its next build (apps/site/scripts/build.mjs). Only a pass shows a "last tested" line.
  record:
    needs: install
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # attaches a file to the release and edits its title and notes; nothing else
    outputs:
      version: ${{ steps.join.outputs.version }}
      result: ${{ steps.join.outputs.result }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: install-result-*
          path: results
      - name: Join, attach to the release, mark a failure
        id: join
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_RESULT: ${{ needs.install.result }}
        run: |
          set -euo pipefail
          files=(results/*/result-*.json)
          version="$(jq -rs 'map(.version) | map(select(. != "")) | first // empty' "${files[@]}")"
          if [ -z "$version" ]; then echo "::error::No machine found the release version, so there is no release to record on."; exit 1; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$version' is not a version."; exit 1; }
          # A machine that left no file (job lost, cancelled before the end) counts as failed: expected is two machines.
          jq -s --arg version "$version" --arg date "$(date -u +%Y-%m-%d)" --arg url "$RUN_URL" --argjson n "${#files[@]}" '
            . as $m
            | ($m | map(.result)) as $r
            | { version: $version, date: $date, run: $url,
                result: (if ($n < 2) or ($r | any(. == "fail")) then "fail"
                         elif ($r | all(. == "skipped")) then "skipped" else "pass" end),
                minutes: ($m | map(select(.result == "pass") | .minutes) | max // null),
                machines: ($m | map({arch, result, minutes})) }' "${files[@]}" > install-result.json
          cat install-result.json
          result="$(jq -r .result install-result.json)"
          # The site job below reads these and the saved file (a failed result is republished as failed, BOS-2787).
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = skipped ]; then echo "::notice::Nothing to install in v$version; no result attached."; exit 0; fi
          gh release upload "v$version" install-result.json --clobber --repo "$GITHUB_REPOSITORY"
          body="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -v '^Install test' || true)"
          if [ "$result" = pass ]; then
            line="$(jq -r '"Install test passed on \(.date): \(.machines | map("\(.arch) \(.minutes) min") | join(", ")). Result: install-result.json."' install-result.json)"
            gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --title "Boss Man $version" --notes "$body"$'\n\n'"$line"
          else
            line="Install test FAILED on $(jq -r .date install-result.json). This release could not be installed on every machine tested. Run: $RUN_URL"
            gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --title "Boss Man $version (install test FAILED)" --notes "$body"$'\n\n'"$line"
            echo "::error::Install test failed for v$version; the release is marked."
            exit 1
          fi
      - name: Keep the joined result for the site job
        if: ${{ always() && steps.join.outputs.result != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: install-result-joined
          path: install-result.json
          retention-days: 7
          if-no-files-found: error

  # BOS-2787: republishes the website from the release's own commit with that release's result, pass or fail, so the install
  # guide's "Last tested" line is never stale and nobody has to run scripts/publish-site.sh by hand. It runs after a failed
  # result too (the guide then says the test failed). The publish settings are in the "site" environment (Settings >
  # Environments > site): variables SITE_URL and CF_PAGES_PROJECT, secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
  # (docs/18-website.md). Not set up (a fork with no website): a warning, nothing published. A failed publish fails this job
  # and marks the release; the old page stays live.
  site:
    needs: record
    if: ${{ always() && (needs.record.result == 'success' || needs.record.result == 'failure') && (needs.record.outputs.result == 'pass' || needs.record.outputs.result == 'fail') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: site
    permissions:
      contents: write # only to add a "republish FAILED" line to the release notes
    concurrency:
      group: republish-site
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.record.outputs.version }}
      SITE_URL: ${{ vars.SITE_URL }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.record.outputs.version }}
          fetch-depth: 0 # the sitemap dates need the history
      - uses: actions/download-artifact@v4
        with:
          name: install-result-joined
          path: ${{ runner.temp }}/joined
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --filter @boss-man/site...
      - name: Republish the site with this result
        env:
          INSTALL_RESULT_FILE: ${{ runner.temp }}/joined/install-result.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/republish-site-after-install.sh
