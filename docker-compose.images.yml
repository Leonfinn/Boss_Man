# Boss Man from ready-made images (BOS-974, docs/35-install-from-images.md). Nothing is built on your machine and nothing is
# needed on the host but Docker: no openssl, no chown, no sudo, no source code.
#
# Every Boss Man image is named by digest (the exact bytes), so what you pull is what was published and signed. The digests and the
# registry come from images.env, which is made from a release's signed release.json (scripts/render-image-env.sh) and downloaded
# with this file from the release page. To use another registry, change BOSSMAN_REGISTRY in images.env.
#
#   docker compose -f docker-compose.images.yml --env-file images.env run --rm setup        # once: master key and database password, in a volume
#   docker compose -f docker-compose.images.yml --env-file images.env up -d
# Then open http://<host>:3100 and create the owner account. Back up the "config" volume: without master.key, stored
# secrets cannot be read.
#
# What compose runs (BOS-1227, 941c): the database, the proxy, the updater and setup. Nothing else. The updater makes the server (blue and
# green colours) and the launcher itself, from the release this file's images.env pins, and from then on moves the whole release
# (server, launcher, runner and network-guard images) through the Docker API at each update. Compose never owns a server or a
# launcher, so `docker compose up` can never bring an older one back or fight the updater. The proxy owns the host ports and
# the name "server"; which colour is live is a network alias the updater moves.
#
# Settings (all optional, in images.env or the environment): BOSSMAN_DOCKER_SOCK (the Docker socket on this host),
# BOSSMAN_BIND / BOSSMAN_HOST_PORT, BOSSMAN_RUNNER_MEMORY and the others the build install (docker-compose.yml) documents.
# The build install is unchanged and still works; do not run both on one host with the same project name.
#
# The environment of the first server and the launcher is in UPDATER_SPEC_ENV and UPDATER_LAUNCHER_ENV below: the updater builds
# every colour and every launcher from those lists, at first start and at every update, so there is one place for them.

name: boss-man

services:
  # Runs once, on its own, with no network: makes the secrets in the config volume. Safe to run again: it never overwrites a file.
  setup:
    image: ${BOSSMAN_REGISTRY:?Use --env-file images.env (see docs/35-install-from-images.md)}/boss-man-launcher@${BOSSMAN_LAUNCHER_DIGEST:?Use --env-file images.env}
    profiles: ["setup"]
    restart: "no"
    command: ["node", "dist/setup.js"]
    # Only so the "Setup is done" message can name the real volumes and the image that copies them (BOS-2846).
    environment:
      BOSSMAN_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-boss-man}
      BOSSMAN_DB_IMAGE: ${BOSSMAN_DB_IMAGE:-pgvector/pgvector:0.8.7-pg17-bookworm}
    user: "0:0"
    network_mode: none
    read_only: true
    # Root, but only able to give the files to the server's user.
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - config:/config
      - db-secret:/db-secret
      # Only to give the folder to the launcher's user before the server's read-only mount makes it root-owned.
      - launcher-key:/launcher-key
      # The updater's key: nothing else makes it, and the updater will not start without it.
      - updater-key:/updater-key

  db:
    # Third-party image from Docker Hub (not published by Boss Man). Pinned by tag, like docker-compose.yml.
    image: ${BOSSMAN_DB_IMAGE:-pgvector/pgvector:0.8.7-pg17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: bossman
      POSTGRES_USER: bossman
      POSTGRES_PASSWORD_FILE: /run/db/db_password
    # The updater only touches containers that carry this label (BOS-941).
    labels:
      com.bossman.install: ${COMPOSE_PROJECT_NAME:-boss-man}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Only the database password. The master key is in "config", which this third-party image never gets.
      - db-secret:/run/db:ro
      # The updater's pg_dump before each update goes here (the last 3 are kept). The updater runs it inside this container.
      - backups:/backups
    mem_limit: ${BOSSMAN_DB_MEMORY:-0}
    mem_reservation: ${BOSSMAN_DB_MEMORY_RESERVED:-256m}
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bossman -d bossman"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    labels:
      com.bossman.install: ${COMPOSE_PROJECT_NAME:-boss-man}
    # The whole configuration is here, so there is no file to edit or reload: which colour is live is a network alias the updater moves.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/Caddyfile <<'CADDY'
        {
        	auto_https off
        	admin off
        }
        :3100 {
        	encode zstd gzip
        	reverse_proxy server-live:3100 {
        		header_up X-Forwarded-For {client_ip}
        		health_uri /api/ready
        		health_interval 2s
        		health_timeout 5s
        		health_fails 3
        		lb_try_duration 15s
        	}
        }
        :3101 {
        	encode zstd gzip
        	reverse_proxy server-live:3101 {
        		header_up X-Forwarded-For {client_ip}
        		health_uri /portal.html
        		health_interval 2s
        		health_timeout 5s
        		health_fails 3
        		lb_try_duration 15s
        	}
        }
        CADDY
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    networks:
      default:
        # Runners dial ws://server:3100 and reach whichever colour is live.
        aliases: [server]
      front:
        ipv4_address: ${BOSSMAN_FRONT_PROXY_IP:-172.30.0.18}
    ports:
      - "${BOSSMAN_BIND:-127.0.0.1}:${BOSSMAN_HOST_PORT:-3100}:3100"
      - "${BOSSMAN_PORTAL_BIND:-127.0.0.1}:${BOSSMAN_PORTAL_HOST_PORT:-3101}:3101"
    tmpfs:
      - /tmp
      - /data
      - /config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    cpu_shares: 2048
    mem_limit: 128m
    mem_reservation: 64m
    oom_score_adj: -900
    pids_limit: 64

  updater:
    # BOS-2804: the name follows the compose project, so two installs on one Docker host never share a container name. The network
    # alias `updater` (the service name) stays, so the server's calls to http://updater:3106 do not change.
    container_name: ${COMPOSE_PROJECT_NAME:-boss-man}-updater
    image: ${BOSSMAN_REGISTRY:?Use --env-file images.env (see docs/35-install-from-images.md)}/boss-man-updater@${BOSSMAN_UPDATER_DIGEST:?Use --env-file images.env (this release needs boss-man-updater published)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.bossman.install: ${COMPOSE_PROJECT_NAME:-boss-man}
    # Starts as root with two capabilities only, to join the Docker socket's group and become uid 1000 (apps/updater/src/startup.ts).
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    environment:
      UPDATER_REPO: ${BOSSMAN_UPDATER_REPO:?Use --env-file images.env (it names the GitHub repository that signed the release)}
      UPDATER_REGISTRY: ${BOSSMAN_REGISTRY}
      UPDATER_INSTALL_LABEL: com.bossman.install=${COMPOSE_PROJECT_NAME:-boss-man}
      UPDATER_CURRENT_VERSION: ${BOSSMAN_VERSION:-0.0.0}
      UPDATER_PACK_VOLUME: ${COMPOSE_PROJECT_NAME:-boss-man}_claude-pack
      UPDATER_NETWORK: ${COMPOSE_PROJECT_NAME:-boss-man}_default
      UPDATER_NAME_PREFIX: updater-job
      # BOS-2804: the server colours, the launcher and the updater are named <project>-server-blue, <project>-launcher, <project>-updater.
      # Unset (an install file from before this) keeps the old fixed names; the updater finds containers by label, so both work.
      UPDATER_NAME_PROJECT: ${COMPOSE_PROJECT_NAME:-boss-man}
      UPDATER_SELF_NAME: ${COMPOSE_PROJECT_NAME:-boss-man}-updater
      UPDATER_FRONT_NETWORK: ${COMPOSE_PROJECT_NAME:-boss-man}_front
      UPDATER_LAUNCHER_NETWORK: ${COMPOSE_PROJECT_NAME:-boss-man}_launcher
      UPDATER_SELF_NETWORK: ${COMPOSE_PROJECT_NAME:-boss-man}_updater
      UPDATER_DB_CONTAINER: ${COMPOSE_PROJECT_NAME:-boss-man}-db-1
      UPDATER_DOCKER_SOCK_HOST: ${BOSSMAN_DOCKER_SOCK:-/var/run/docker.sock}
      UPDATER_SERVER_MEMORY_RESERVED: "536870912"
      # The release this install file pins: the updater makes the server and the launcher from these digests at first start (no backup,
      # no soak: nothing is serving yet) and only ever moves forward from there, by a signed release.
      UPDATER_FIRST_SERVER_DIGEST: ${BOSSMAN_SERVER_DIGEST:?Use --env-file images.env}
      UPDATER_FIRST_LAUNCHER_DIGEST: ${BOSSMAN_LAUNCHER_DIGEST:?Use --env-file images.env}
      UPDATER_FIRST_RUNNER_DIGEST: ${BOSSMAN_RUNNER_DIGEST:?Use --env-file images.env}
      UPDATER_FIRST_NETGUARD_DIGEST: ${BOSSMAN_NETGUARD_DIGEST:?Use --env-file images.env}
      # The values the updater gives every server colour it makes, one KEY=value per line.
      UPDATER_SPEC_ENV: |
        DATABASE_URL=postgres://bossman@db:5432/bossman
        BOSSMAN_DATABASE_PASSWORD_FILE=/run/db/db_password
        BOSSMAN_MASTER_KEY_FILE=/run/config/master.key
        BOSSMAN_LAUNCHER=1
        BOSSMAN_DRAIN_MINUTES=${BOSSMAN_DRAIN_MINUTES:-30}
        BOSSMAN_LAUNCHER_URL=http://launcher:3105
        BOSSMAN_LAUNCHER_KEY_FILE=/run/launcher/key
        BOSSMAN_INSECURE_COOKIES=${BOSSMAN_INSECURE_COOKIES:-0}
        BOSSMAN_TRUSTED_PROXIES=${BOSSMAN_FRONT_PROXY_IP:-172.30.0.18}
        BOSSMAN_PORTAL_PORT=3101
        BOSSMAN_PORTAL_URL=${BOSSMAN_PORTAL_URL:-}
        NODE_OPTIONS=--max-old-space-size=${BOSSMAN_SERVER_HEAP_MB:-1536}
        BOSSMAN_STALL_PROFILE=${BOSSMAN_STALL_PROFILE:-}
      UPDATER_SPEC_MOUNTS: |
        ${COMPOSE_PROJECT_NAME:-boss-man}_config:/run/config:ro
        ${COMPOSE_PROJECT_NAME:-boss-man}_db-secret:/run/db:ro
        ${COMPOSE_PROJECT_NAME:-boss-man}_launcher-key:/run/launcher:ro
      UPDATER_SELF_MOUNTS: |
        ${COMPOSE_PROJECT_NAME:-boss-man}_updater-state:/state
        ${COMPOSE_PROJECT_NAME:-boss-man}_updater-key:/run/updater
        ${COMPOSE_PROJECT_NAME:-boss-man}_launcher-key:/run/launcher:ro
      # The values the updater gives every launcher it makes (the runner and guard images are set by the updater from the release; the
      # `release-current` file in the updater's state folder, mounted read-only, tells a running launcher which release to start from).
      UPDATER_LAUNCHER_ENV: |
        BOSSMAN_DATA=/data
        BOSSMAN_DATA_HOST=auto
        BOSSMAN_INSTALL_LABEL=com.bossman.install=${COMPOSE_PROJECT_NAME:-boss-man}
        BOSSMAN_RUNNER_NETWORK=${BOSSMAN_RUNNER_NETWORK:-${COMPOSE_PROJECT_NAME:-boss-man}_default}
        BOSSMAN_RUNNER_URL=ws://server:3100/api/runner/connect
        BOSSMAN_RUNNER_MEMORY=${BOSSMAN_RUNNER_MEMORY:-}
        BOSSMAN_RUNNER_PIDS=${BOSSMAN_RUNNER_PIDS:-4096}
        BOSSMAN_RUNNER_CPU_SHARES=${BOSSMAN_RUNNER_CPU_SHARES:-512}
        BOSSMAN_RUNNER_CPUS=${BOSSMAN_RUNNER_CPUS:-}
        BOSSMAN_RESERVED_THREADS=${BOSSMAN_RESERVED_THREADS:-off}
        BOSSMAN_CHECK_SLOTS=${BOSSMAN_CHECK_SLOTS:-}
        BOSSMAN_OPENCODE_SESSION_DAYS=${BOSSMAN_OPENCODE_SESSION_DAYS:-}
        PNPM_STORE_DIR=${PNPM_STORE_DIR:-}
        BOSSMAN_NETGUARD=${BOSSMAN_NETGUARD:-auto}
        BOSSMAN_NETGUARD_ALLOW=${BOSSMAN_NETGUARD_ALLOW:-}
        BOSSMAN_LAUNCHER_KEY_FILE=/run/launcher/key
      UPDATER_LAUNCHER_MOUNTS: |
        ${COMPOSE_PROJECT_NAME:-boss-man}_data:/data
        ${COMPOSE_PROJECT_NAME:-boss-man}_launcher-key:/run/launcher
        ${COMPOSE_PROJECT_NAME:-boss-man}_updater-state:/run/release:ro
    volumes:
      - ${BOSSMAN_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - updater-state:/state
      - updater-key:/run/updater
      # The launcher's key, read-only: the updater asks the launcher whether a run is starting before it replaces it.
      - launcher-key:/run/launcher:ro
    # The updater's own private network, the front network (to ask a new colour whether it is ready) and the launcher's.
    networks: [updater, front, launcher]

networks:
  launcher:
    internal: true
  # The updater's own network (only the updater and the server's calls to it).
  updater:
    internal: true
  # Proxy, the two server colours and the updater only: no runners, no internet. A fixed proxy address, colours from the range.
  # If the defaults clash with something on the host ("Pool overlaps"), set BOSSMAN_FRONT_SUBNET, BOSSMAN_FRONT_RANGE and BOSSMAN_FRONT_PROXY_IP.
  front:
    internal: true
    ipam:
      config:
        - subnet: ${BOSSMAN_FRONT_SUBNET:-172.30.0.16/28}
          ip_range: ${BOSSMAN_FRONT_RANGE:-172.30.0.24/29}

volumes:
  config:
  db-secret:
  data:
  launcher-key:
  db-data:
  # The last three database dumps the updater makes before an update.
  backups:
  # The updater's progress file, its trusted-root cache and `release-current`; its key (the server reads it to call the updater).
  updater-state:
  updater-key:
  # The Claude pack volume the updater installs into (the launcher mounts it).
  claude-pack:
